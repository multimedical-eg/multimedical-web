م: {المستلم}\n\nنشكركم على ثقتكم الغالية، ونتمنى لمزرعتكم دوام الصحة والإنتاج 🐔🐄💚", "delivered_rep": "✅ *تم التسليم لعميلك*\n━━━━━━━━━━━━━━\n🏡 العميل: *{العميل}*\n🧾 {المستند}: {الفاتورة}\n{سطر_الإجمالي}\n👤 السائق: {السائق}\n🕐 {الوقت}{المرتجعات}", "delivered_admin": "✅ *تسليم — {الرحلة}*\n🏡 {العميل} | 🧾 {الفاتورة}\n{سطر_الإجمالي}\n✍️ المستلم: {المستلم}\n👤 {السائق} — 🕐 {الوقت}{المرتجعات}", "failed_customer": "🌿 *{الشركة}*\n\nالسادة / *{العميل}*،\nنأسف لتعذّر توصيل طلبيتكم اليوم 🙏\n📝 السبب: {السبب}\n\nسيتم التواصل معكم لتحديد موعد جديد مناسب لكم في أقرب وقت.{سطر_المندوب}\n\nشكراً لتفهمكم 💚", "failed_rep": "⚠️ *تعذّر التسليم لعميلك*\n━━━━━━━━━━━━━━\n🏡 العميل: *{العميل}*\n📝 السبب: {السبب}\n👤 السائق: {السائق} 📞 {هاتف_السائق}\n🕐 {الوقت}\n\n📌 برجاء التواصل مع العميل وتحديد موعد جديد.", "failed_admin": "⚠️ *تعذّر تسليم — {الرحلة}*\n🏡 {العميل}\n📝 {السبب}\n👤 {السائق} — 🕐 {الوقت}", "done_driver": "✅ *تم إنهاء رحلتك {الرحلة}*\n━━━━━━━━━━━━━━\n🚛 {السيارة} | 🕐 العودة: {الوقت}\n\n📦 تم التسليم: {المسلم} من {المحطات} محطة{تعذر}\n🔢 العداد: {عداد_البداية} ← {عداد_النهاية}\n🛣️ المسافة: *{الكيلومترات} كم*\n\nالرحلة الآن بانتظار اعتماد مسؤول الحركة. شكراً لمجهودك 🙏\n— {الشركة}", "done_admin": "🏁 *انتهاء رحلة {الرحلة}*\n━━━━━━━━━━━━━━\n👤 {السائق} | 🚛 {السيارة}\n🕐 العودة: {الوقت}\n\n📦 تم التسليم: {المسلم} من {المحطات} محطة\n{سطر_إجمالي_الرحلة}{تعذر}\n\n🔢 العداد: {عداد_البداية} ← {عداد_النهاية}\n🛣️ المسافة الفعلية: *{الكيلومترات} كم* (المخطط ≈ {المسافة_المخططة} كم)\n💸 المصروفات: {المصروفات}"};
const TPL=k=>(SET().tpl||{})[k]||DEF_TPL[k];
const NOTIFY_ON=k=>(SET().notify||{})[k]!==false;
const fillTpl=(t,v)=>t.replace(/\{([^{}]+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m);
function nvars(t,s,d,extra){const st=SET(),f=s?farm(s.farmId):{},r=s?repOf(f.repId):null,dr=drv(t.driverId);
  const v={'الشركة':st.company,'الرحلة':t.no,'التاريخ':t.date,'السائق':dr.name,'هاتف_السائق':dr.phone||'','السيارة':veh(t.vehicleId).plate,'الوقت':fmtDT(nowISO()),
    'العهدة':custody(t).map(x=>`• ${item(x.itemId).name}${x.batch&&x.batch!=='رصيد افتتاحي'?' ('+x.batch+')':''} × ${x.loaded}`).join('\n'),
    'خط_السير':(t.stops||[]).map((x,i)=>{const ff=farm(x.farmId),u=farmMap(ff);return `${i+1}. ${ff.name}${x.eta?' — '+x.eta:''}${ff.phone?' — '+ff.phone:''}${u?'\n   '+u:''}`}).join('\n'),
    'العميل':f.name||'','الموعد':s&&s.eta?s.eta:'خلال اليوم','المندوب':r?r.name:'','هاتف_المندوب':r?r.phone||'':'',
    'سطر_المندوب':r?`\n💼 مندوبكم: ${r.name}${r.phone?' — 📞 '+r.phone:''}`:'','سطر_موقع_السائق':t.track&&t.track.last?`\n📍 موقع السائق: ${mapURL(t.track.last.lat,t.track.last.lng)}`:'',
    'رابط_المسار':plannedRouteURL(t)||'—','عداد_البداية':t.startOdo?N(t.startOdo):'—','عداد_النهاية':t.endOdo?N(t.endOdo):'—','الكيلومترات':tripKm(t)!=null?N(tripKm(t)):'—','المسافة_المخططة':plannedKm(t).km?N(plannedKm(t).km):'—','المصروفات':money(tripExp(t)),'المحطات':N((t.stops||[]).length)};
  v['المستند']=PR()?'فاتورة':'إذن تسليم';
  if(d)Object.assign(v,{'سطر_الإجمالي':PR()?`💰 *الإجمالي: ${money(d.total)}*${d.pay?.amount?'\n💵 المحصّل: '+money(d.pay.amount):''}\n💳 الدفع: ${d.pay?.method||''}`:`📦 *إجمالي الكميات: ${N(unitsOf(d))} عبوة*`,'الفاتورة':d.invNo,'الإجمالي':PR()?money(d.total):N(unitsOf(d))+' عبوة','المستلم':d.receiver,'الدفع':d.pay?.method||'','المحصل':d.pay?.amount?'\nالمحصّل: '+money(d.pay.amount):'',
    'أصناف_الفاتورة':(d.lines||[]).filter(l=>+l.qty>0).map(l=>`▫️ ${l.name}${l.batch&&l.batch!=='رصيد افتتاحي'?' (تشغيلة '+l.batch+')':''} × ${l.qty}${PR()&&+l.price?' = '+money(l.qty*l.price):''}`).join('\n'),
    'المرتجعات':(d.lines||[]).some(l=>+l.ret||+l.dmg)||(d.custReturns||[]).length?'\n⚠️ يوجد مرتجع/تالف — راجع '+DOCN():''});
  if(t.status==='done'||extra&&extra.done){const ds=delsOf(t.id);Object.assign(v,{'المسلم':N((t.stops||[]).filter(x=>sstatus(t,x)==='delivered').length),'المحطات':N((t.stops||[]).length),'إجمالي_الرحلة':PR()?money(ds.reduce((a,x)=>a+(+x.total||0),0)):N(ds.reduce((a,x)=>a+unitsOf(x),0))+' عبوة','سطر_إجمالي_الرحلة':PR()?'💰 إجمالي الفواتير: '+money(ds.reduce((a,x)=>a+(+x.total||0),0)):'📦 إجمالي المسلَّم: '+N(ds.reduce((a,x)=>a+unitsOf(x),0))+' عبوة','تعذر':(t.stops||[]).filter(x=>sstatus(t,x)==='failed').map(x=>'\n✖ '+farm(x.farmId).name+': '+(sst(t,x).failReason||'')).join('')})}
  return Object.assign(v,extra||{})}
function buildNotifs(ev,t,s,d,extra){const out=[];const mk=(to,name,phone,text,stopId)=>{if(normPhone(phone))out.push({id:uid(),at:nowISO(),event:ev,to,tripId:t.id,stopId:stopId||'',deliveryId:d?d.id:'',name,phone,text,status:'pending',by:meLabel()})};
  for(const to of EVENTS[ev].to){const key=ev+'_'+to;if(!NOTIFY_ON(key))continue;
    if(to==='driver'){const dr=drv(t.driverId);mk('driver',dr.name,dr.phone,fillTpl(TPL(key),nvars(t,null,d,extra)))}
    else if(to==='admin'){mk('admin','الإدارة',SET().adminWa,fillTpl(TPL(key),nvars(t,s,d,extra)),s&&s.id)}
    else if(to==='customer'){(s?[s]:(t.stops||[])).forEach(x=>{const f=farm(x.farmId);mk('customer',f.name,d&&d.receiverPhone||f.phone,fillTpl(TPL(key),nvars(t,x,d,extra)),x.id)})}
    else if(to==='rep'){if(s){const r=repOf(farm(s.farmId).repId);if(r)mk('rep',r.name,r.phone,fillTpl(TPL(key),nvars(t,s,d,extra)),s.id)}
      else{const g={};(t.stops||[]).forEach(x=>{const rid=farm(x.farmId).repId;if(rid&&repOf(rid))(g[rid]=g[rid]||[]).push(x)});
        Object.entries(g).forEach(([rid,xs])=>{const r=repOf(rid);mk('rep',r.name,r.phone,fillTpl(TPL(key),nvars(t,xs[0],d,Object.assign({'عملاء_المندوب':xs.map(x=>`• ${farm(x.farmId).name}${x.eta?' — '+x.eta:''}`).join('\n')},extra||{}))))})}}}
  return out}
async function notify(ev,t,s,d,extra){const ns=buildNotifs(ev,t,s,d,extra);for(const n of ns)await put('notifs',n);return ns}
function nRow(n,compact){return `<div class="alert ${n.status==='pending'?'info':''}" style="${n.status!=='pending'?'background:#f3f6f7':''}"><div style="flex:1;min-width:0"><b>${TOL[n.to]}: ${esc(n.name)}</b> <span class="mut sm">${esc(n.phone)} • ${EVENTS[n.event]?.l||n.event}${compact?'':' • '+fmtDT(n.at)}</span>
  <div class="sm" style="white-space:pre-wrap;max-height:${compact?'0':'70px'};overflow:hidden;color:#445">${compact?'':esc(n.text)}</div>${n.status==='sent'?`<div class="sm" style="color:var(--ok)">✓ أُرسل ${fmtT(n.sentAt)} — ${esc(n.sentBy||'')}</div>`:n.status==='skipped'?'<div class="sm mut">تم التجاهل</div>':''}</div>
  <div class="row" style="flex:none"><a class="btn wa sm" href="${waURL(n.phone,n.text)}" target="_blank" rel="noopener" onclick="markSent('${n.id}')">${WAICON} ${n.status==='sent'?'إعادة':'إرسال'}</a>${n.status==='pending'?`<button class="btn sm" onclick="skipN('${n.id}')">تجاهل</button>`:''}</div></div>`}
function markSent(id){const n=S.notifs[id];if(!n)return;patch('notifs',id,{status:'sent',sentAt:nowISO(),sentBy:meLabel()});audit('إرسال واتساب','notif',id,`${TOL[n.to]} ${n.name} — ${EVENTS[n.event]?.l||''}`);setTimeout(()=>{const b=document.querySelector(`[data-nbox]`);if(b)b.innerHTML=nList(b.dataset.nbox)},100)}
function skipN(id){patch('notifs',id,{status:'skipped',sentBy:meLabel(),sentAt:nowISO()})}
function nList(filter){const [k,v]=filter.split(':');const ns=L('notifs').filter(n=>n[k]===v).sort((a,b)=>(a.at||'').localeCompare(b.at||''));return ns.map(n=>nRow(n,false)).join('')||'<div class="empty">لا توجد إشعارات</div>'}
function nModal(title,ns){if(!ns.length)return;const ids=ns.map(n=>n.id);modal(`<h3>${title}</h3><p class="mut sm">اضغط «إرسال» لكل رسالة — هيفتح واتساب والرسالة جاهزة. الرسائل اللي مش هتتبعت دلوقتي بتفضل في «إشعارات واتساب».</p><div id="nmb">${ids.map(id=>nRow(S.notifs[id],false)).join('')}</div><div class="actions"><button class="btn" onclick="closeModal()">تم</button></div>`);
  window._nm=setInterval(()=>{const b=$('#nmb');if(!b){clearInterval(window._nm);return}b.innerHTML=ids.map(id=>S.notifs[id]?nRow(S.notifs[id],false):'').join('')},1500)}
async function sendNow(ev,tid,sid){const t=S.trips[tid],s=t.stops.find(x=>x.id===sid);const ns=await notify(ev,t,s,null);if(!ns.length)return toast('لا يوجد رقم واتساب للمستلم أو الإشعار متوقف من الإعدادات','err');nModal(EVENTS[ev].l,ns)}
const WAF={st:'pending',d:''};
function vWA(){let ns=L('notifs').filter(n=>(!WAF.st||n.status===WAF.st)&&(!WAF.d||(n.at||'').slice(0,10)===WAF.d)).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const by={};ns.forEach(n=>{(by[n.to]=by[n.to]||[]).push(n)});
  return `<div class="row between" style="margin-bottom:12px"><h2>إشعارات واتساب</h2><button class="btn" onclick="go('settings');setTimeout(()=>document.getElementById('tplCard')?.scrollIntoView(),50)">قوالب الرسائل</button></div>
  <div class="filters"><label>الحالة<select onchange="WAF.st=this.value;render()">${[['pending','بانتظار الإرسال'],['sent','تم الإرسال'],['skipped','متجاهلة'],['','الكل']].map(o=>`<option value="${o[0]}" ${WAF.st===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><label>اليوم<input type="date" value="${WAF.d}" onchange="WAF.d=this.value;render()"></label></div>
  <div class="note" style="margin-bottom:12px">التطبيق بيجهّز الرسائل تلقائياً مع كل حدث (خروج الرحلة، الوصول، التسليم، التعذّر، العودة) لكل من العميل والسائق والمندوب والإدارة. الإرسال بضغطة من الموبايل أو الكمبيوتر اللي عليه واتساب.</div>
  ${ns.length?['customer','rep','driver','admin'].filter(k=>by[k]).map(k=>`<div class="card"><h3>${TOL[k]} (${N(by[k].length)})</h3>${by[k].slice(0,150).map(n=>nRow(n,false)).join('')}</div>`).join(''):'<div class="card empty">لا توجد إشعارات</div>'}`}
function vTplSettings(){const st=SET();return `<div class="card" id="tplCard"><h3>قوالب رسائل واتساب</h3><p class="mut sm">فعّل أو أوقف كل رسالة وعدّل نصها. المتغيرات بين { } بتتملى تلقائياً: {العميل} {السائق} {هاتف_السائق} {السيارة} {الرحلة} {التاريخ} {الموعد} {المندوب} {هاتف_المندوب} {الفاتورة} {الإجمالي} {المحصل} {الدفع} {المستلم} {أصناف_الفاتورة} {المرتجعات} {السبب} {العهدة} {خط_السير} {عملاء_المندوب} {الوقت} {الشركة} {المستند} {سطر_الإجمالي} {سطر_إجمالي_الرحلة} {سطر_المندوب} {سطر_موقع_السائق} {رابط_المسار} {عداد_البداية} {عداد_النهاية} {الكيلومترات} {المسافة_المخططة} {المصروفات} {المحطات}</p>
  <form id="tplF" onsubmit="saveTpl(event)">${Object.entries(EVENTS).map(([ev,e])=>`<h4 style="margin:14px 0 6px">${e.l}</h4><div class="grid2">${e.to.map(to=>{const k=ev+'_'+to;return `<div><label class="chk"><input type="checkbox" name="on_${k}" ${NOTIFY_ON(k)?'checked':''}> إرسال إلى ${TOL[to]}</label><textarea name="tpl_${k}" rows="5" style="margin-top:4px;font-size:12px">${esc(TPL(k))}</textarea></div>`}).join('')}</div>`).join('')}
  <div class="actions"><button class="btn primary">حفظ القوالب</button><button type="button" class="btn" onclick="resetTpl()">استرجاع النصوص الافتراضية</button></div></form></div>`}
async function saveTpl(e){e.preventDefault();const fd=new FormData($('#tplF'));const tpl={},notify={};Object.entries(EVENTS).forEach(([ev,x])=>x.to.forEach(to=>{const k=ev+'_'+to;const v=String(fd.get('tpl_'+k)||'').trim();if(v&&v!==DEF_TPL[k])tpl[k]=v;notify[k]=fd.get('on_'+k)==='on'}));
  await put('settings',Object.assign({},DEF_SET,S.settings.main||{},{id:'main',tpl,notify}));audit('تعديل قوالب واتساب','settings','main','');toast('تم حفظ القوالب')}
function resetTpl(){confirmBox('استرجاع كل نصوص الرسائل الافتراضية؟',async()=>{await put('settings',Object.assign({},DEF_SET,S.settings.main||{},{id:'main',tpl:{}}));render()})}

function fieldHTML(f,val){const cls=f.full?'full':'';

function flatPaths(o,pre,out){out=out||{};for(const k in o){const v=o[k],key=(pre?pre+'.':'')+k;if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flatPaths(v,key,out);else out[key]=v}return out}

function fsAdapter(fdb){
  const wrapSnap=s=>({id:s.id,exists:s.exists,data:()=>s.data(),metadata:s.metadata});
  const wrapRef=r=>({id:r.id,path:r.path,get:()=>mapErr(r.get().then(wrapSnap)),set:(d,o)=>mapErr(o?r.set(d,o):r.set(d)),update:d=>mapErr(r.update(flatPaths(d))),delete:()=>mapErr(r.delete()),
    onSnapshot:(n,e)=>r.onSnapshot(s=>n(wrapSnap(s)),er=>e&&e({code:FSERR[er.code]||'unavailable',message:er.message}))});
  const wrapQ=q=>({where:(...a)=>wrapQ(q.where(...a)),orderBy:(...a)=>wrapQ(q.orderBy(...a)),limit:n=>wrapQ(q.limit(n)),get:()=>mapErr(q.get()),
    onSnapshot:(n,e)=>q.onSnapshot({includeMetadataChanges:true},n,er=>e&&e({code:er.code==='permission-denied'?'revoked':(FSERR[er.code]||'unavailable'),message:er.message}))});
  return{collection:c=>{const cr=fdb.collection(c);const w=wrapQ(cr);w.doc=id=>wrapRef(id?cr.doc(id):cr.doc());return w},doc:p=>wrapRef(fdb.doc(p))}}

function pushWatch(c,snap){if(!['trips','deliveries'].includes(c))return;
  if(!PW.init[c]){if(!snap.metadata.fromCache)PW.init[c]=true;snap.docs.forEach(d=>{const x=d.data()||{};PW.seen[c+d.id]=pwSig(x);Object.entries(x.stopState||{}).forEach(([k,v])=>{if(v&&v.status==='failed')PW.seen['f'+k]=1})});return}

  snap.docChanges().forEach(ch=>{const d=ch.doc,x=d.data()||{};if(ch.type==='removed')return;
    const key=c+d.id,prev=PW.seen[key];const cur=pwSig(x);PW.seen[key]=cur;if(prev===cur||d.metadata.hasPendingWrites||!ME)return;
    const pst=prev?JSON.parse(prev)[0]:null;
    if(c==='trips'){const dn=drv(x.driverId).name||'السائق';
      if(drvMe&&x.driverId===ME.driverId){if(!prev&&x.status!=='cancelled')pushShow('🚚 رحلة جديدة عليك',`رحلة ${x.no||''} — ${x.date||''} — ${(x.stops||[]).length} محطة`,d.id);

        else if(x.status==='done')pushShow('🏁 رحلة رجعت — بانتظار الاعتماد',`${dn} — رحلة ${x.no||''}${x.km!=null?' — '+x.km+' كم':''}`,d.id)}
      if(office&&prev&&pst===x.status&&x.status==='out'){const st=x.stopState||{};const f=Object.entries(st).filter(([k,v])=>v&&v.status==='failed'&&!PW.seen['f'+k]);f.forEach(([k,v])=>{PW.seen['f'+k]=1;const sp=(x.stops||[]).find(s=>s.id===k);pushShow('⚠️ تعذّر تسليم',`${dn} — ${sp?farm(sp.farmId).name:''}: ${v.failReason||''}`,d.id)})}}
    if(c==='deliveries'&&office&&!prev)pushShow('📦 تم التسليم',`${farm(x.farmId).name||''} — ${x.invNo||''}`,x.tripId)})}
function resync(){toast('جاري تحديث البيانات…');try{FDB&&FDB.disableNetwork().then(()=>FDB.enableNetwork()).then(()=>{SYNC.last=Date.now();toast('تم التحديث');render()})}catch(e){location.reload()}}
function hookResume(){const A=plug('App');const onRes=()=>{try{FDB&&FDB.enableNetwork()}catch(e){}SYNC.online=navigator.onLine;schedRender()};if(A)A.addListener('resume',onRes);document.addEventListener('visibilitychange',()=>{if(!document.hidden)onRes()});
  const LN=plug('LocalNotifications');if(LN)LN.addListener('localNotificationActionPerformed',a=>{const t=a&&a.notification&&a.notification.extra&&a.notification.extra.tid;if(t)setTimeout(()=>openPush(t),400)})}
/* زرار الرجوع في أندرويد */
function hookBack(){const A=plug('App');if(!A)return;A.addListener('backButton',()=>{if(!$('#modal').classList.contains('hidden'))return closeModal();if(SIDE){SIDE=false;return render()}
  if(ME&&ME.role==='driver'){if(DTRIP){DTRIP=null;DTAB='trip';return render()}}else if(ME&&VIEW!=='dash'){return go(VIEW==='trip'?'trips':'dash')}A.minimizeApp()})}

(async()=>{try{await loadFirebase()}catch(e){}hookBack();hookResume();bootApp()})();
</script>
</body>
