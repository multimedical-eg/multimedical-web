<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#334C36">
<title>مالتي ميديكا — إدارة الحركة والتوزيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#334C36;--brand2:#44633F;--brand-l:#E8EEE4;--amber:#9C8F2E;--amber-l:#F6F2D8;--ink:#15231F;--ink2:#3D4F4A;--mut:#6B7D78;--paper:#F3F6F5;--card:#fff;--line:#DDE5E2;--line2:#EBF0EE;
--err:#C23A2B;--errl:#FBEAE7;--warn:#9A6400;--warnl:#FFF4DB;--ok:#1E8A4F;--okl:#E6F4EC;--blue:#2A5BD7;--bluel:#EAF0FD;--r:10px;--side:248px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}html,body{overflow-x:hidden}
@media(max-width:600px){.band{grid-template-columns:1fr 1fr}.band>div{border-bottom:1px solid var(--line2)}.band .v{font-size:22px}.ph h2{font-size:19px}.rs{padding:12px}.node .nm{font-size:10.5px}}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.65}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:700}h1{font-size:22px}h2{font-size:20px}h3{font-size:15.5px}h4{font-size:14px}
a{color:var(--brand2);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.full{grid-column:1/-1}
.g-dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:980px){.grid2,.grid3,.g-dash{grid-template-columns:minmax(0,1fr)}}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:var(--side);flex:none;background:var(--brand);color:#D7E7E3;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.side .brandbox{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.mark{width:38px;height:38px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none}
.brandbox b{display:block;color:#fff;font-size:16px;line-height:1.2}.brandbox small{font-size:11.5px;opacity:.75}
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.nav .grp{font-size:11.5px;color:#9EC2BA;margin:14px 10px 4px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;cursor:pointer;color:#D7E7E3;font-weight:500;position:relative}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav button.on::before{content:'';position:absolute;right:-10px;top:8px;bottom:8px;width:4px;border-radius:4px 0 0 4px;background:var(--amber)}
.nav .cnt{margin-inline-start:auto;background:var(--amber);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700;line-height:18px}
.nav .cnt.r{background:#E0533F}
.me{border-top:1px solid rgba(255,255,255,.1);padding:12px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.me>div:not(.avatar){flex:1;min-width:0;font-size:13px;color:#fff}.me small{display:block;color:#9EC2BA;font-size:11.5px}
.me button{all:unset;cursor:pointer;color:#9EC2BA;padding:6px;border-radius:6px}.me button:hover{color:#fff;background:rgba(255,255,255,.08)}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{min-height:60px;padding-top:env(safe-area-inset-top)!important;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar .date{color:var(--mut);font-size:13px}.topbar .sp{flex:1}
.iconbtn{all:unset;cursor:pointer;position:relative;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--paper)}.iconbtn .dot{position:absolute;top:4px;left:4px;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.menu-btn{display:none}
.gs{position:relative;width:min(420px,40vw)}.gs input{background:var(--paper);border-color:var(--line)}
.gsr{position:absolute;top:44px;right:0;left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(10,30,26,.18);max-height:60vh;overflow:auto;z-index:40;padding:6px}
.gsr button{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}.gsr button:hover{background:var(--paper)}
@media(max-width:900px){.gs{width:auto;flex:1}}
main{padding:22px 24px 40px;max-width:1360px;width:100%;margin:0 auto}
.sync{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--okl);color:var(--ok);white-space:nowrap;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.off{background:var(--warnl);color:var(--warn)}.sync.loc{background:var(--line2);color:var(--ink2)}
@media(max-width:900px){.side{position:fixed;right:0;transform:translateX(100%);transition:transform .2s}.side.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.2)}.menu-btn{display:grid}main{padding:16px 14px 40px}.topbar{padding:0 12px}.topbar .date{display:none}}
.scrim{position:fixed;inset:0;background:rgba(10,30,26,.4);z-index:25}
/* page heads */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:22px}.ph p{margin:2px 0 0;color:var(--mut)}
main>.row.between:first-child,main>h2:first-child{margin-bottom:16px!important}
main>.row.between:first-child h2,main>h2:first-child{font-size:22px}
/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card h3{margin-bottom:12px}
.card>.row.between:first-child{margin-bottom:12px}.card>.row.between:first-child h3{margin:0}
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.band>div{padding:14px 18px;border-inline-start:1px solid var(--line2)}.band>div:first-child{border-inline-start:0}
.band .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}.band .l{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:6px}
.band .v.r{color:var(--err)}.band .v.g{color:var(--ok)}.band .v.a{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.kpi{padding:12px 16px;border-inline-start:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kpi .v{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}.kpi .l{color:var(--mut);font-size:12px}
.kpi.red .v{color:var(--err)}.kpi.grn .v{color:var(--ok)}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none!important;display:inline-flex;align-items:center;gap:7px;line-height:1.3;transition:background .12s,border-color .12s}
.btn:hover{border-color:#B9C8C3;background:#FAFCFB}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.red{background:#fff;border-color:#EBC0BA;color:var(--err)}.btn.red:hover{background:var(--errl)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.wa{background:#1FAF55;border-color:#1FAF55;color:#fff}.btn.wa:hover{background:#18994A}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand2);padding-inline:6px}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.big{padding:14px 18px;font-size:16px;width:100%;justify-content:center;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;background:#FAFCFB}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td,table tr:hover td{background:#FAFCFB}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-out,.b-arrived{background:var(--bluel);color:var(--blue)}.b-done,.b-warn{background:var(--warnl);color:var(--warn)}.b-approved,.b-delivered,.b-ok{background:var(--okl);color:var(--ok)}
.b-failed,.b-cancelled,.b-err{background:var(--errl);color:var(--err)}.b-cold{background:#E4F1FB;color:#1C6AA3}.b-draft{background:var(--line2);color:var(--ink2)}
.prog{height:6px;background:var(--line2);border-radius:6px;overflow:hidden;min-width:70px}.prog i{display:block;height:100%;background:var(--brand2);border-radius:6px}
/* forms */
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px;color:var(--ink2)}
input,select,textarea{border:1px solid #CBD7D3;border-radius:8px;padding:9px 11px;background:#fff;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(68,99,63,.15)}
label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500}label.chk input{width:18px;height:18px;accent-color:var(--brand)}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}.filters label{min-width:150px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,30,26,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
.mbox{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:760px;box-shadow:0 24px 70px rgba(10,30,26,.3);position:relative}
.mbox>h3:first-of-type{margin:0 0 16px;font-size:18px;padding-inline-end:36px}
.mclose{position:absolute;top:14px;left:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast div.err{background:var(--err)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:8px;align-items:flex-start;font-size:13px;border-inline-start:3px solid transparent}
.alert.err{background:var(--errl);border-color:var(--err)}.alert.warn{background:var(--warnl);border-color:var(--amber)}.alert.info{background:var(--bluel);border-color:var(--blue)}
.alert b{white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin-top:12px}
.kv div{font-size:13.5px}.kv span{display:block;color:var(--mut);font-size:12px}
.stop{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.stop .num{width:28px;height:28px;border-radius:50%;border:2px solid var(--brand2);color:var(--brand2);display:grid;place-items:center;font-weight:700;flex:none;background:#fff}
.stop.delivered .num{background:var(--ok);border-color:var(--ok);color:#fff}.stop.failed .num{background:var(--err);border-color:var(--err);color:#fff}.stop.arrived .num{background:var(--blue);border-color:var(--blue);color:#fff}
.stop .body{flex:1;min-width:0}
canvas.sig{width:100%;height:170px;border:2px dashed #B8C8C3;border-radius:10px;background:#FBFDFC;touch-action:none;display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.note{background:var(--brand-l);border-radius:8px;padding:10px 12px;font-size:13px;color:#174A42}
/* route strip — signature element */
.rs{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;margin-bottom:10px;cursor:pointer}
.rs:hover{border-color:#B9C8C3}
.rs-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rs-h .t{font-weight:700}.rs-h .m{color:var(--mut);font-size:12.5px}.rs-h .sp{flex:1}
.line{display:flex;align-items:flex-start;margin:14px 4px 2px;position:relative}
.node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.node::before{content:'';position:absolute;top:8px;left:50%;width:100%;height:3px;background:var(--line);z-index:0}
.node:first-child::before{display:none}
.node.pass::before{background:var(--brand2)}
.node .d{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);background:#fff;z-index:1;position:relative}
.node.depot .d{border-radius:5px;border-color:var(--brand);background:var(--brand)}
.node.delivered .d{background:var(--ok);border-color:var(--ok)}.node.failed .d{background:var(--err);border-color:var(--err)}.node.arrived .d{background:var(--blue);border-color:var(--blue)}
.node.next .d{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-l)}.node.late .d{border-color:var(--err);box-shadow:0 0 0 4px var(--errl)}
.node .nm{font-size:11.5px;color:var(--ink2);margin-top:6px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.node .tm{font-size:11px;color:var(--mut)}
.truck{position:absolute;top:-20px;left:50%;z-index:2;color:var(--amber);transform:translateX(-50%) scaleX(-1)}
/* bars chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:34px;background:var(--brand2);border-radius:5px 5px 0 0;min-height:2px}
.bars>div.today i{background:var(--amber)}
.bars span{font-size:11px;color:var(--mut)}.bars em{font-style:normal;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lside{background:var(--brand);color:#D7E7E3;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lside h1{color:#fff;font-size:30px;line-height:1.35;margin:28px 0 10px;max-width:440px}.lside p{max-width:420px;margin:0;color:#A9CBC3}
.lroute{margin-top:36px;max-width:440px}
.lmain{display:grid;place-items:center;padding:28px;background:var(--paper)}
.lbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:420px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.roles button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px;cursor:pointer;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px;justify-content:center}
.roles button.on{border-color:var(--brand2);background:var(--brand-l);color:var(--brand)}
.roles button:last-child{grid-column:1/-1}
@media(max-width:860px){.login{grid-template-columns:1fr}.lside{padding:24px;min-height:auto}.lside h1{font-size:22px;margin:16px 0 6px}.lroute{display:none}}
/* driver app */
.drv{background:var(--paper)}
.dhead{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:20}
.dhead .row{color:#fff}.dhead small{color:#A9CBC3}
.dhead .line .nm{color:#CFE3DE}.dhead .node::before{background:rgba(255,255,255,.2)}.dhead .node.pass::before{background:#7FD1BE}.dhead .node .d{border-color:rgba(255,255,255,.35);background:var(--brand)}
.dhead .node.depot .d{background:#fff;border-color:#fff}.dhead .node.delivered .d{background:#4CC38A;border-color:#4CC38A}
.dmain{padding:14px 14px 96px;max-width:640px;margin:0 auto}
.bnav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;font-size:12px;color:var(--mut);cursor:pointer;position:relative}
.bnav button.on{color:var(--brand);font-weight:700}.bnav button.on::before{content:'';position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}
.bnav .dot{position:absolute;top:5px;margin-inline-start:22px;background:var(--err);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;line-height:15px}
.nextcard{background:#fff;border:2px solid var(--amber);border-radius:14px;padding:16px;margin-bottom:14px}
.nextcard .lbl{color:var(--amber);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
.nextcard h2{font-size:21px;margin:6px 0 2px}
.steps{display:flex;gap:6px;margin:12px 0}
.steps span{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps span.on{background:var(--brand2)}
.tcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer}
/* print */
#printArea{position:fixed;left:-12000px;top:0;width:794px;background:#fff}
.doc{padding:34px;font-family:'IBM Plex Sans Arabic',sans-serif;color:#111;direction:rtl;width:794px;background:#fff}
.doc table{font-size:12px}.doc th{background:#EAF3F1;color:#123}.doc td,.doc th{border:1px solid #CFDCD8}
.dochead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:12px;margin-bottom:14px}
.inv{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mapwrap{display:grid;grid-template-columns:1fr 300px;gap:14px}.maphost{height:calc(100vh - 190px);min-height:420px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#eef2ee}.maplist{max-height:calc(100vh - 190px);overflow:auto}.mcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.mcard.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-l)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%}.vmk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}.vlb{position:absolute;top:36px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #ccd;border-radius:6px;padding:0 5px;font-size:11px;font-weight:700;white-space:nowrap}.smk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid #334C36}.dmk{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;border:2px solid #334C36;font-size:16px}.leaflet-container{font-family:inherit}@media(max-width:900px){.mapwrap{grid-template-columns:1fr}.maphost{height:60vh}.maplist{max-height:none}}</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= أدوات عامة ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=d?new Date(d):new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>ymd();
const nowISO=()=>new Date().toISOString();
const fmtT=iso=>iso?new Date(iso).toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'}):'—';
const fmtDT=iso=>iso?new Date(iso).toLocaleString('ar-EG-u-nu-latn',{dateStyle:'short',timeStyle:'short'}):'—';
const money=n=>(+n||0).toLocaleString('ar-EG-u-nu-latn',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
const N=n=>(+n||0).toLocaleString('ar-EG-u-nu-latn');
const daysTo=d=>d?Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000):null;
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return ymd(x)};
function toast(m,t){const d=document.createElement('div');d.textContent=m;if(t)d.className=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3800)}
function modal(html,wide){$('#mbox').innerHTML=`<button class="iconbtn mclose" onclick="closeModal()" aria-label="إغلاق">${I('x')}</button>`+html;$('#mbox').style.maxWidth=wide?'980px':'760px';$('#modal').classList.remove('hidden');$('#modal').scrollTop=0}
function closeModal(){$('#modal').classList.add('hidden');$('#mbox').innerHTML=''}
function confirmBox(text,onYes,yesLabel){modal(`<h3>تأكيد</h3><p>${text}</p><div class="actions"><button class="btn primary" id="cyes">${yesLabel||'نعم، تأكيد'}</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);$('#cyes').onclick=async()=>{closeModal();await onYes()}}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function normPhone(p){let d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0')&&d.length===11)d='2'+d;if(d.length===10&&d.startsWith('1'))d='20'+d;return d}
const waURL=(p,t)=>`https://wa.me/${normPhone(p)}?text=${encodeURIComponent(t)}`;
const waBtn=(p,t,label,cls)=>`<a class="btn wa ${cls||''}" href="${waURL(p,t)}" target="_blank" rel="noopener">${WAICON} ${label||'واتساب'}</a>`;
const WAICON='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
function haversine(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function parseCoords(s){s=String(s||'');let m=s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);return m?{lat:+m[1],lng:+m[2]}:null}
const mapURL=(lat,lng)=>`https://www.google.com/maps?q=${lat},${lng}`;
function farmMap(f){if(f.lat&&f.lng)return mapURL(f.lat,f.lng);if(f.mapUrl)return f.mapUrl;if(f.address)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(f.address);return ''}
const LOADED={};let loadScript=function(u){if(LOADED[u])return LOADED[u];LOADED[u]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=()=>res();s.onerror=()=>{s.remove();delete LOADED[u];rej(new Error('load'))};document.head.appendChild(s)});return LOADED[u]}
const LIBCDN={'vendor/xlsx.full.min.js':'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','vendor/html2canvas.min.js':'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','vendor/jspdf.umd.min.js':'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'};
const LIB={xlsx:'vendor/xlsx.full.min.js',h2c:'vendor/html2canvas.min.js',jspdf:'vendor/jspdf.umd.min.js'};
const _ls=loadScript;loadScript=u=>_ls(u).catch(()=>{const f=LIBCDN[u];if(f)return _ls(f);throw new Error('load')});
const FBV='10.14.1';async function loadFirebase(){for(const n of ['app','auth','firestore']){try{await _ls('vendor/firebase-'+n+'-compat.js')}catch(e){await _ls(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${n}-compat.js`)}}}

/* ================= طبقة البيانات (سحابي مشترك + طابور بدون إنترنت) ================= */
const COLS=['settings','items','batches','drivers','vehicles','farms','trips','deliveries','audit','reps','notifs','routes'];
const S={};COLS.forEach(c=>S[c]={});
let DB=null,DL=null,MODE='',READY=false;
const SYNC={online:navigator.onLine,err:''};
let OUTBOX=LS.get('mm_outbox',[]);
const L=c=>Object.values(S[c]);
const clean=o=>JSON.parse(JSON.stringify(o));
const chains={};
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms||12000))])}
function chainW(key,fn){const p=(chains[key]||Promise.resolve()).catch(()=>{}).then(fn);chains[key]=p;return p}
function rawSet(col,obj,merge){return chainW(col+'/'+obj.id,()=>DB.collection(col).doc(obj.id).set(clean(obj),merge?{merge:true}:undefined))}
function queue(col,obj,merge){const prev=OUTBOX.find(o=>o.col===col&&o.obj.id===obj.id);let ent;
  if(merge&&prev){ent={col,merge:prev.merge,obj:deepMerge(clean(prev.obj),clean(obj))}}else ent={col,merge:!!merge,obj:clean(obj)};
  OUTBOX=OUTBOX.filter(o=>o!==prev);OUTBOX.push(ent);if(!LS.set('mm_outbox',OUTBOX))toast('مساحة الجهاز ممتلئة — احتفظ بالتطبيق مفتوحاً حتى تعود الشبكة','err');schedRender()}
function fatal(e){return e&&(e.code==='invalid_argument'||e.code==='quota_exceeded'||e.code==='revoked')}
function errMsg(e){return e.code==='quota_exceeded'?'امتلأت مساحة قاعدة البيانات':e.code==='revoked'?'تم سحب صلاحية الوصول':'الجهاز غير معتمد أو مفيش صلاحية — راجع مسؤول الحركة'}
async function put(col,obj){obj.updatedAt=nowISO();S[col][obj.id]=obj;schedRender();
  if(MODE==='local'){LS.set('mm_l_'+col,S[col]);return true}
  try{await withTimeout(rawSet(col,obj));return true}catch(e){if(fatal(e)){toast('تعذّر الحفظ: '+errMsg(e),'err');return false}queue(col,obj);return true}}
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){if(!t[k]||typeof t[k]!=='object'||Array.isArray(t[k]))t[k]={};deepMerge(t[k],s[k])}else t[k]=s[k]}return t}
async function patch(col,id,partial){const cur=S[col][id];if(!cur)return false;partial.updatedAt=nowISO();deepMerge(cur,clean(partial));schedRender();
  if(MODE==='local'){LS.set('mm_l_'+col,S[col]);return true}
  try{await withTimeout(chainW(col+'/'+id,()=>DB.collection(col).doc(id).update(clean(partial))));return true}catch(e){if(fatal(e)&&e.code!=='invalid_argument'){toast('تعذّر الحفظ: '+errMsg(e),'err');return false}if(e.code==='invalid_argument'){toast('تعذّر الحفظ: '+errMsg(e),'err');return false}queue(col,Object.assign(clean(partial),{id}),true);return true}}
async function flushOutbox(){if(MODE!=='cloud'||!OUTBOX.length)return;for(const o of OUTBOX.slice()){try{await withTimeout(rawSet(o.col,o.obj,o.merge));OUTBOX=OUTBOX.filter(x=>x!==o)}catch(e){if(fatal(e))OUTBOX=OUTBOX.filter(x=>x!==o);else break}}LS.set('mm_outbox',OUTBOX);schedRender()}
async function putProof(id,data){const obj=Object.assign({id},data);
  if(MODE==='local'){const m=LS.get('mm_proofs',{});m[id]=obj;if(!LS.set('mm_proofs',m))toast('مساحة الجهاز ممتلئة — قد لا تُحفظ الصور','err');return}
  try{await withTimeout(rawSet('proofs',obj),20000)}catch(e){if(fatal(e)){toast('تعذّر حفظ التوقيع والصور: '+errMsg(e),'err');return}queue('proofs',obj)}}
async function getProof(id){if(MODE==='local')return LS.get('mm_proofs',{})[id]||null;const o=OUTBOX.find(o=>o.col==='proofs'&&o.obj.id===id);if(o)return o.obj;try{const s=await withTimeout(DB.collection('proofs').doc(id).get());return s.exists?s.data():null}catch(e){return null}}
function startLocal(){MODE='local';COLS.forEach(c=>S[c]=LS.get('mm_l_'+c,{}));READY=true;render()}
function startCloud(db){DB=db;MODE='cloud';const got=new Set();
  const timer=setTimeout(()=>{SYNC.err='تعذّر الوصول للبيانات حالياً — المعروض قد لا يكون محدّثاً';READY=true;render()},10000);
  COLS.forEach(c=>{let q=db.collection(c);if(c==='audit'||c==='notifs')q=q.orderBy('at','desc').limit(500);if(c==='trips'||c==='deliveries')q=q.where('date','>=',addDays(today(),-(+SET().historyDays||180)));
    q.onSnapshot(snap=>{try{pushWatch(c,snap)}catch(e){}const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=Object.assign({},d.data(),{id:d.id})});
      OUTBOX.filter(o=>o.col===c).forEach(o=>{m[o.obj.id]=o.merge&&m[o.obj.id]?deepMerge(m[o.obj.id],clean(o.obj)):o.obj});S[c]=m;
      if(!snap.metadata.fromCache){SYNC.last=Date.now();got.add(c);if(got.size>=COLS.length){clearTimeout(timer);if(/تعذّر الوصول/.test(SYNC.err))SYNC.err=''}}
      if(!READY){READY=true}schedRender()},
    e=>{clearTimeout(timer);READY=true;SYNC.err=e&&e.code==='revoked'?'تم سحب صلاحية الوصول':'انقطعت المزامنة ('+(e&&e.code||'')+') — أعد فتح الصفحة';schedRender()})});
  flushOutbox()}
window.addEventListener('online',()=>{SYNC.online=true;flushOutbox();schedRender()});
window.addEventListener('offline',()=>{SYNC.online=false;schedRender()});
setInterval(()=>{flushOutbox();if(READY&&VIEW==='dash')schedRender()},45000);

/* ================= الإعدادات والصلاحيات ================= */
const DEF_SET={company:'شركة مالتي ميديكا للمستحضرات البيطرية',companyEn:'Multimedica Veterinary Products',phone:'',address:'',taxNo:'',adminWa:'',
  pins:{admin:'1234',manager:'2222',warehouse:'3333',accountant:'4444'},depotLat:'',depotLng:'',roadFactor:1.3,kmTolerance:25,oilAlertKm:500,docAlertDays:30,odoGapKm:5,odoPhotoReq:false,showPrices:false,expiryDays:90,tempMin:2,tempMax:8,routeKm:1.5,lateMin:15,vat:0,workFrom:7,workTo:19,invPrefix:'MM'};
const SET=()=>{const s=S.settings.main||{};return Object.assign({},DEF_SET,s,{pins:Object.assign({},DEF_SET.pins,s.pins||{})})};
const PR=()=>SET().showPrices===true;const DOCN=()=>PR()?'الفاتورة':'إذن التسليم';const unitsOf=d=>(d.lines||[]).reduce((a,l)=>a+(+l.qty||0),0);
const ROLES={admin:'مسؤول الحركة',manager:'المدير',warehouse:'أمين المخزن',accountant:'مراجع الحسابات',driver:'سائق'};
const PERMS={admin:'*',manager:'dash trips newtrip approve farms fleet items deliveries reports alerts audit recall notifs',warehouse:'dash trips load items deliveries alerts recall whreturn gate notifs',accountant:'dash deliveries reports audit alerts'};
let ME=LS.get('mm_session',null);
const can=p=>!!ME&&ME.role!=='driver'&&(ME.role==='admin'||(p!=='settings'&&permsOf(ME.role).includes(p)));
const meLabel=()=>!ME?'':ME.role==='driver'?(drv(ME.driverId).name+' (سائق)'):ROLES[ME.role];
function audit(action,entity,id,details){const a={id:uid(),at:nowISO(),who:meLabel(),role:ME?ME.role:'',action,entity,entityId:id||'',details:details||''};put('audit',a)}

/* ================= مساعدات الكيانات ================= */
const item=id=>S.items[id]||{name:'صنف غير معروف',unit:'',price:0,code:''};
const drv=id=>S.drivers[id]||{name:'—',phone:''};
const veh=id=>S.vehicles[id]||{plate:'—'};
const farm=id=>S.farms[id]||{name:'—',phone:''};
const repOf=id=>S.reps[id]||null;
const delsOf=tid=>L('deliveries').filter(d=>d.tripId===tid);
const STAT={draft:'مسودة',out:'في الطريق',done:'عادت — بانتظار الاعتماد',approved:'معتمدة',cancelled:'ملغاة'};
const SSTAT={pending:'لم يصل',arrived:'وصل',delivered:'تم التسليم',failed:'تعذّر التسليم'};
const badge=s=>`<span class="badge b-${s}">${STAT[s]||s}</span>`;
const sbadge=s=>`<span class="badge b-${s}">${SSTAT[s]||s}</span>`;
const sst=(t,s)=>(t.stopState&&t.stopState[s.id])||{};
const sstatus=(t,s)=>sst(t,s).status||'pending';
function custody(t){const m={};const k=(i,b)=>i+'|'+(b||'');
  (t.lines||[]).forEach(l=>{const key=k(l.itemId,l.batch);m[key]=m[key]||{key,itemId:l.itemId,batch:l.batch||'',expiry:l.expiry||'',loaded:0,del:0,ret:0,dmg:0};m[key].loaded+=+l.qty||0});
  delsOf(t.id).forEach(d=>(d.lines||[]).forEach(x=>{const key=k(x.itemId,x.batch);m[key]=m[key]||{key,itemId:x.itemId,batch:x.batch||'',expiry:x.expiry||'',loaded:0,del:0,ret:0,dmg:0};m[key].del+=+x.qty||0;m[key].ret+=+x.ret||0;m[key].dmg+=+x.dmg||0}));
  return Object.values(m).map(r=>Object.assign(r,{rem:r.loaded-r.del-r.dmg}))}
function custReturnsOf(t){const out=[];delsOf(t.id).forEach(d=>(d.custReturns||[]).forEach(r=>out.push(Object.assign({farmId:d.farmId,invNo:d.invNo},r))));return out}
function isLate(t,s){if(!s.eta||sstatus(t,s)!=='pending'||t.status!=='out')return false;return Date.now()>new Date(t.date+'T'+s.eta).getTime()+SET().lateMin*60000}
function onTime(t,s){const x=sst(t,s);if(!s.eta||!x.arriveAt)return null;return new Date(x.arriveAt).getTime()<=new Date(t.date+'T'+s.eta).getTime()+SET().lateMin*60000}
const tripCold=t=>(t.lines||[]).some(l=>item(l.itemId).cold);
function getLoc(){return new Promise(res=>{if(!navigator.geolocation)return res(null);let done=false;const fin=v=>{if(!done){done=true;res(v)}};setTimeout(()=>fin(null),9000);
  try{navigator.geolocation.getCurrentPosition(p=>fin({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>fin(null),{enableHighAccuracy:true,timeout:8000,maximumAge:30000})}catch(e){fin(null)}})}

/* ================= التنبيهات الذكية ================= */
function alerts(){const st=SET(),A=[],since=addDays(today(),-7);
  L('batches').forEach(b=>{if(!(+b.qty>0))return;const d=daysTo(b.expiry);if(d===null)return;const it=item(b.itemId);
    if(d<0)A.push({lv:'err',t:'منتهي الصلاحية',m:`${it.name} — تشغيلة ${b.batch} انتهت ${b.expiry} (الرصيد ${N(b.qty)} ${it.unit})`});
    else if(d<=st.expiryDays)A.push({lv:'warn',t:'صلاحية قريبة',m:`${it.name} — تشغيلة ${b.batch} تنتهي خلال ${N(d)} يوم (الرصيد ${N(b.qty)})`})});
  L('trips').forEach(t=>{if(t.status==='cancelled')return;const dn=drv(t.driverId).name;
    (t.stops||[]).forEach(s=>{const x=sst(t,s);
      if(isLate(t,s))A.push({lv:'err',t:'تأخير وصول',m:`${dn} ← ${farm(s.farmId).name} (الموعد ${s.eta})`,trip:t.id});
      if(x.offRoute&&t.date>=since)A.push({lv:'warn',t:'خارج المسار',m:`${dn}: تسجيل الوصول لـ ${farm(s.farmId).name} على بعد ${x.offRoute} كم من موقع المزرعة`,trip:t.id})});
    if(t.status==='done'||(t.status==='approved'&&t.date>=since)){const p=(t.stops||[]).filter(s=>['pending','arrived'].includes(sstatus(t,s)));if(p.length)A.push({lv:'warn',t:'تسليم غير مكتمل',m:`رحلة ${t.no} (${dn}): ${p.length} محطة لم يتم التسليم بها`,trip:t.id})}
    if(t.status==='done'&&!t.whReturn){const r=custody(t).reduce((a,x)=>a+x.rem,0);if(r>0)A.push({lv:'warn',t:'عهدة لم تُسلَّم للمخزن',m:`رحلة ${t.no} (${dn}): ${N(r)} وحدة متبقية بانتظار الاستلام`,trip:t.id})}
    if(t.whReturn&&t.whReturn.diff&&t.date>=since)A.push({lv:'err',t:'اختلاف كميات',m:`رحلة ${t.no} (${dn}): المستلم بالمخزن لا يطابق المتبقي في العهدة`,trip:t.id});
    if(t.loadTemp!==undefined&&t.loadTemp!==''&&t.loadTemp!==null&&(+t.loadTemp<st.tempMin||+t.loadTemp>st.tempMax)&&t.date>=since)A.push({lv:'err',t:'سلسلة التبريد',m:`رحلة ${t.no}: درجة حرارة التحميل ${t.loadTemp}°`,trip:t.id})});
  L('deliveries').forEach(d=>{if(d.date<since)return;if(d.temp!==''&&d.temp!=null&&(+d.temp<st.tempMin||+d.temp>st.tempMax))A.push({lv:'err',t:'سلسلة التبريد',m:`درجة ${d.temp}° عند التسليم لـ ${farm(d.farmId).name} (${DOCN()} ${d.invNo})`,trip:d.tripId});
    if((d.lines||[]).some(l=>+l.ret>0||+l.dmg>0))A.push({lv:'info',t:'مرتجع / تالف',m:`${farm(d.farmId).name} — ${DOCN()} ${d.invNo}`,trip:d.tripId})});
  return A.concat(fleetAlerts())}
const alertHTML=a=>`<div class="alert ${a.lv}"><b>${esc(a.t)}</b><span style="flex:1">${esc(a.m)}</span>${a.trip&&ME.role!=='driver'?`<button class="btn sm" onclick="openTrip('${a.trip}')">فتح</button>`:''}</div>`;

/* ================= الواجهة ================= */

function routeStrip(t,opts){opts=opts||{};const stops=t.stops||[];const nxi=stops.findIndex(s=>!['delivered','failed'].includes(sstatus(t,s)));const doneAll=t.status==='done'||t.status==='approved';
  const nodes=[{dep:1,nm:opts.light?'الشركة':'المخزن',tm:t.outTime?fmtT(t.outTime):'',pass:t.status!=='draft'}].concat(stops.map((s,i)=>{const st=sstatus(t,s),x=sst(t,s);return{nm:farm(s.farmId).name,st,tm:x.arriveAt?fmtT(x.arriveAt):(s.eta||''),pass:['delivered','failed','arrived'].includes(st),next:t.status==='out'&&i===nxi,late:isLate(t,s)}})).concat([{dep:1,nm:opts.light?'العودة':'العودة',tm:t.returnTime?fmtT(t.returnTime):'',pass:doneAll}]);
  const lastPass=nodes.map(n=>n.pass).lastIndexOf(true);
  return `<div class="line">${nodes.map((n,i)=>`<div class="node ${n.dep?'depot':''} ${n.st||''} ${n.pass&&i>0?'pass':''} ${n.next?'next':''} ${n.late?'late':''}">${t.status==='out'&&i===lastPass?`<span class="truck">${I('trips',20)}</span>`:''}<div class="d"></div><div class="nm" title="${esc(n.nm)}">${esc(n.nm)}</div><div class="tm">${esc(n.tm)}</div></div>`).join('')}</div>`}
function tripStrip(t){const n=(t.stops||[]).length,dn=(t.stops||[]).filter(s=>sstatus(t,s)==='delivered').length;const late=(t.stops||[]).some(s=>isLate(t,s));const val=delsOf(t.id).reduce((a,d)=>a+(PR()?(+d.total||0):unitsOf(d)),0);
  return `<div class="rs" onclick="openTrip('${t.id}')"><div class="rs-h"><span class="t">${esc(drv(t.driverId).name)}</span><span class="m">${esc(veh(t.vehicleId).plate)} — رحلة ${esc(t.no)}${t.route?' — '+esc(t.route):''}</span><span class="sp"></span>${late?'<span class="badge b-err">متأخر</span>':''}${badge(t.status)}<span class="m">${N(dn)}/${N(n)} تسليم${val?' — '+(PR()?money(val):N(val)+' عبوة'):''}</span></div>${routeStrip(t)}</div>`}
function weekBars(){const days=[...Array(7)].map((_,i)=>addDays(today(),i-6));const vals=days.map(d=>L('deliveries').filter(x=>x.date===d).reduce((a,x)=>a+(PR()?(+x.total||0):unitsOf(x)),0));const cnt=days.map(d=>L('deliveries').filter(x=>x.date===d).length);const mx=Math.max(1,...vals);
  return `<div class="bars">${days.map((d,i)=>`<div class="${d===today()?'today':''}" title="${PR()?money(vals[i]):N(vals[i])+' عبوة'} — ${N(cnt[i])} ${PR()?'فاتورة':'إذن'}"><em>${vals[i]?(PR()?N(Math.round(vals[i]/1000*10)/10)+'k':N(vals[i])):''}</em><i style="height:${Math.round(vals[i]/mx*110)}px"></i><span>${new Date(d+'T12:00').toLocaleDateString('ar-EG-u-nu-latn',{weekday:'short'})}</span></div>`).join('')}</div>`}

function doLogin(e){e.preventDefault();const pin=$('#lpin').value.trim();
  if(LROLE==='driver'){const d=S.drivers[$('#ldrv')?.value];if(!d)return toast('اختر السائق','err');if(String(d.pin||'')!==pin)return toast('الرقم السري غير صحيح','err');ME={role:'driver',driverId:d.id}}
  else{if(String(SET().pins[LROLE])!==pin)return toast('الرقم السري غير صحيح','err');ME={role:LROLE}}

  return `<tr style="cursor:pointer" onclick="openTrip('${t.id}')"><td class="b">${esc(t.no)}<div class="mut sm">${esc(t.route||'')}</div></td><td>${esc(drv(t.driverId).name)}</td><td>${esc(veh(t.vehicleId).plate)}</td><td>${fmtT(t.outTime)}</td><td><div class="prog"><i style="width:${n?dn/n*100:0}%"></i></div><span class="sm mut">${N(dn)}/${N(n)}</span></td><td>${badge(t.status)}${late?' <span class="badge b-err">متأخر</span>':''}</td></tr>`}).join('')}</table></div>`}

  ${crs.length?`<h4 style="margin-top:12px">مرتجعات من العملاء (على السيارة)</h4><div class="tw"><table><tr><th>العميل</th><th>الصنف</th><th>التشغيلة</th><th class="n">الكمية</th><th>السبب</th></tr>${crs.map(r=>`<tr><td>${esc(farm(r.farmId).name)}</td><td>${esc(item(r.itemId).name)}</td><td>${esc(r.batch||'—')}</td><td class="n">${N(r.qty)}</td><td>${esc(r.reason||'')}</td></tr>`).join('')}</table></div>`:''}
  ${t.whReturn?`<div class="alert ${t.whReturn.diff?'err':'info'}" style="margin-top:10px"><b>استلام المخزن</b><span>${fmtDT(t.whReturn.at)} — ${esc(t.whReturn.by)} ${t.whReturn.diff?'— يوجد اختلاف في الكميات':'— مطابق'}</span></div>`:''}</div>
  <div class="card"><div class="row between"><h3>خط السير (${N((t.stops||[]).length)} محطة)</h3>${canStops?`<button class="btn sm primary" onclick="addStop('${t.id}')">+ إضافة محطة</button>`:''}</div>
  ${(t.stops||[]).length?(t.stops||[]).map((s,i)=>stopHTML(t,s,i,canStops)).join(''):'<div class="empty">أضف المزارع بترتيب الزيارة</div>'}</div></div>
  ${t.status!=='draft'?kmCard(t):''}
  ${(()=>{const tn=L('notifs').filter(n=>n.tripId===t.id).sort((a,b)=>(a.at||'').localeCompare(b.at||''));return tn.length?`<div class="card"><h3>إشعارات واتساب للرحلة (${N(tn.filter(n=>n.status==='pending').length)} بانتظار الإرسال)</h3>${tn.map(n=>nRow(n,false)).join('')}</div>`:''})()}
  ${(t.corrections||[]).length?`<div class="card"><h3>التصحيحات الموثّقة</h3>${t.corrections.map(c=>`<div class="alert info"><b>${fmtDT(c.at)}</b><span style="flex:1"><b>${esc(c.by)}</b> — السبب: ${esc(c.reason)}<br>${esc(c.text)}</span></div>`).join('')}</div>`:''}`}
function stopHTML(t,s,i,edit){const f=farm(s.farmId),x=sst(t,s),stt=sstatus(t,s),late=isLate(t,s),d=x.deliveryId&&S.deliveries[x.deliveryId];const u=farmMap(f);
  return `<div class="stop ${stt}"><div class="num">${i+1}</div><div class="body"><div class="row between"><b>${esc(f.name)}</b><span>${sbadge(stt)}${late?' <span class="badge b-err">متأخر</span>':''}${x.offRoute?` <span class="badge b-warn">بعيد ${x.offRoute} كم</span>`:''}</span></div>
  <div class="mut sm">${esc(f.address||'')} ${f.phone?'• '+esc(f.phone):''} ${s.eta?'• الموعد '+s.eta:''}</div>${orderTxt(s)?`<div class="sm" style="margin-top:3px">📦 الطلبية: ${esc(orderTxt(s))}</div>`:''}
  <div class="sm">${x.arriveAt?'وصل '+fmtT(x.arriveAt):''} ${x.arriveLoc?`<a href="${mapURL(x.arriveLoc.lat,x.arriveLoc.lng)}" target="_blank" rel="noopener">موقع الوصول</a>`:''} ${x.failReason?'<span style="color:var(--err)">السبب: '+esc(x.failReason)+'</span>':''}</div>
  <div class="row" style="margin-top:6px">${d?`<button class="btn sm" onclick="showInvoice('${d.id}')">${DOCN()} ${esc(d.invNo)}</button>`:''}${u?`<a class="btn sm" href="${u}" target="_blank" rel="noopener">الخريطة</a>`:''}${edit?`${i>0?`<button class="btn sm" onclick="moveStop('${t.id}',${i},-1)">▲</button>`:''}${i<t.stops.length-1?`<button class="btn sm" onclick="moveStop('${t.id}',${i},1)">▼</button>`:''}${stt==='pending'?`<button class="btn sm" onclick="delStop('${t.id}','${s.id}')">حذف</button>`:''}${t.status==='draft'?`<button class="btn sm" onclick="editOrder('${t.id}','${s.id}')">📦 الطلبية</button>`:''}`:''}</div></div></div>`}
function tripActions(t){const b=[];const dp=drv(t.driverId).phone;
  if(t.status!=='cancelled')b.push(waBtn(dp,tripWAText(t),'إرسال للسائق','sm'));
  b.push(`<button class="btn sm" onclick="tripPDF('${t.id}')">أمر التحميل PDF</button>`);if(can('newtrip'))b.push(`<button class="btn sm" onclick="dupTrip('${t.id}')">↺ تكرار الرحلة</button>`);
  if(t.status==='draft'&&(can('gate')||can('newtrip')))b.push(`<button class="btn sm primary" onclick="tripOut('${t.id}')">🚀 بدء الرحلة / خروج السيارة</button>`);
  if(t.status==='draft'&&can('newtrip')&&(t.stops||[]).length>1)b.push(`<button class="btn sm" onclick="tripOptimize('${t.id}')">🧭 رتّب أقصر طريق</button>`);if(t.status==='draft'&&can('newtrip'))b.push(`<button class="btn sm red" onclick="cancelTrip('${t.id}')">إلغاء</button>`);
  if(t.status==='out'&&(can('gate')||can('newtrip')))b.push(`<button class="btn sm dark" onclick="tripReturn('${t.id}')">🏁 تسجيل العودة</button>`);
  if(['out','done'].includes(t.status)&&can('newtrip'))b.push(`<button class="btn sm" onclick="expenseForm('${t.id}')">💸 مصروف</button>`);
  if(t.status==='done'&&!t.whReturn&&can('whreturn'))b.push(`<button class="btn sm primary" onclick="whReturn('${t.id}')">استلام المتبقي بالمخزن</button>`);
  if(t.status==='done'&&can('approve'))b.push(`<button class="btn sm primary" onclick="approveTrip('${t.id}')">اعتماد الرحلة</button>`);
  if(t.status==='approved'&&can('approve'))b.push(`<button class="btn sm" onclick="correctTrip('${t.id}')">تصحيح موثّق</button>`);
  return b.join('')}
function addLine(tid){const t=S.trips[tid];if(lockedMsg(t))return;const its=L('items').filter(i=>i.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'ar'));if(!its.length)return toast('أضف الأصناف أولاً','err');
  modal(`<h3>إضافة صنف للعهدة</h3><form id="lnf" class="grid2"><label class="full">الصنف<select id="lnItem">${its.map(i=>`<option value="${i.id}">${esc(i.code)} — ${esc(i.name)}</option>`).join('')}</select></label>
  <label class="full">التشغيلة<select id="lnBatch"></select></label><div id="lnManual" class="grid2 full hidden"><label>رقم التشغيلة<input id="lnB"></label><label>تاريخ الصلاحية<input id="lnE" type="date"></label></div>
  <label>الكمية<input id="lnQ" type="number" min="1" step="1" required></label><div id="lnInfo" class="mut sm" style="align-self:end"></div>
  <div class="actions full"><button class="btn primary">إضافة</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`);
  const fill=()=>{const iid=$('#lnItem').value;const bs=L('batches').filter(b=>b.itemId===iid&&+b.qty>0).sort((a,b)=>(a.expiry||'').localeCompare(b.expiry||''));
    $('#lnBatch').innerHTML=bs.map(b=>{const d=daysTo(b.expiry);return `<option value="${b.id}" ${d!==null&&d<0?'disabled':''}>${esc(b.batch)} — صلاحية ${esc(b.expiry||'?')} — رصيد ${N(b.qty)}${d!==null&&d<0?' (منتهية)':d!==null&&d<=SET().expiryDays?' ⚠ قريبة':''}</option>`}).join('')+'<option value="_m">إدخال يدوي (تشغيلة غير مسجلة بالمخزن)</option>';
    const first=bs.find(b=>daysTo(b.expiry)===null||daysTo(b.expiry)>=0);$('#lnBatch').value=first?first.id:'_m';upd()};
  const upd=()=>{$('#lnManual').classList.toggle('hidden',$('#lnBatch').value!=='_m');const it=item($('#lnItem').value);$('#lnInfo').textContent=`الوحدة: ${it.unit||'—'} • السعر: ${money(it.price)}${it.cold?' • يحتاج تبريد':''}`};
  $('#lnItem').onchange=fill;$('#lnBatch').onchange=upd;fill();
  $('#lnf').onsubmit=async e=>{e.preventDefault();const t=S.trips[tid];if(lockedMsg(t))return;const q=+$('#lnQ').value;if(!(q>0))return toast('أدخل كمية صحيحة','err');const iid=$('#lnItem').value,bid=$('#lnBatch').value;let batch,expiry;
    if(bid==='_m'){batch=$('#lnB').value.trim();expiry=$('#lnE').value;if(expiry&&daysTo(expiry)<0)return toast('لا يمكن تحميل صنف منتهي الصلاحية','err')}
    else{const b=S.batches[bid];if(q>+b.qty)return toast(`الكمية أكبر من رصيد التشغيلة (${N(b.qty)})`,'err');if(daysTo(b.expiry)<0)return toast('التشغيلة منتهية الصلاحية','err');batch=b.batch;expiry=b.expiry;b.qty=+b.qty-q;await put('batches',b)}
    const line={id:uid(),itemId:iid,batch,expiry,qty:q,batchId:bid==='_m'?'':bid,at:nowISO(),by:meLabel()};
    const lines=(t.lines||[]).concat([line]);await patch('trips',tid,{lines});audit('تحميل صنف','trip',tid,`${t.no}: ${item(iid).name} تشغيلة ${batch||'—'} × ${q}${t.status==='out'?' (تحميل إضافي أثناء الرحلة)':''}`);closeModal()}}
async function delLine(tid,key){const t=S.trips[tid];if(t.status!=='draft')return toast('لا يمكن حذف بضاعة بعد خروج السيارة','err');
  confirmBox('حذف هذا الصنف من العهدة وإرجاع الكمية لرصيد المخزن؟',async()=>{const rm=(t.lines||[]).filter(l=>l.itemId+'|'+(l.batch||'')===key);for(const l of rm){if(l.batchId&&S.batches[l.batchId]){const b=S.batches[l.batchId];b.qty=+b.qty+(+l.qty);await put('batches',b)}}
    await patch('trips',tid,{lines:(t.lines||[]).filter(l=>!rm.includes(l))});audit('حذف صنف من العهدة','trip',tid,`${t.no}: ${item(rm[0]?.itemId).name} × ${rm.reduce((a,l)=>a+(+l.qty),0)}`)})}
function addStop(tid){const t=S.trips[tid];if(lockedMsg(t))return;const fs=L('farms').filter(f=>f.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'ar'));if(!fs.length)return toast('أضف المزارع أولاً','err');
  formModal('إضافة محطة لخط السير',[{k:'farmId',label:'المزرعة / العميل',type:'select',opts:fs.map(f=>[f.id,f.name+(f.area?' — '+f.area:'')]),req:1,full:1},{k:'eta',label:'موعد الوصول المتوقع',type:'time'},{k:'note',label:'ملاحظة للسائق'}],{},async v=>{const stops=(t.stops||[]).concat([Object.assign({id:uid()},v)]);await patch('trips',tid,{stops});audit('إضافة محطة','trip',tid,`${t.no}: ${farm(v.farmId).name}`)})}
async function moveStop(tid,i,d){const t=S.trips[tid];if(lockedMsg(t))return;const s=t.stops.slice();[s[i],s[i+d]]=[s[i+d],s[i]];await patch('trips',tid,{stops:s});audit('إعادة ترتيب خط السير','trip',tid,t.no)}
async function delStop(tid,sid){const t=S.trips[tid];if(lockedMsg(t))return;const s=t.stops.find(x=>x.id===sid);await patch('trips',tid,{stops:t.stops.filter(x=>x.id!==sid)});audit('حذف محطة','trip',tid,`${t.no}: ${farm(s.farmId).name}`)}
function cancelTrip(tid){const t=S.trips[tid];confirmBox('إلغاء الرحلة وإرجاع البضاعة المحمّلة لرصيد المخزن؟',async()=>{for(const l of t.lines||[]){if(l.batchId&&S.batches[l.batchId]){const b=S.batches[l.batchId];b.qty=+b.qty+(+l.qty);await put('batches',b)}}await patch('trips',tid,{status:'cancelled'});audit('إلغاء رحلة','trip',tid,t.no)},'إلغاء الرحلة')}
function whReturn(tid){const t=S.trips[tid];const cu=custody(t).filter(r=>r.rem>0);const cr=custReturnsOf(t);
  modal(`<h3>استلام المتبقي والمرتجعات بالمخزن — ${esc(t.no)}</h3><p class="mut sm">أدخل الكمية المستلمة فعلياً. أي اختلاف عن المتبقي في العهدة يُسجَّل كتنبيه.</p>
  <div class="tw"><table><tr><th>الصنف</th><th>التشغيلة</th><th class="n">المتبقي بالعهدة</th><th>المستلم فعلياً</th></tr>${cu.map((r,i)=>`<tr><td>${esc(item(r.itemId).name)}</td><td>${esc(r.batch||'—')}</td><td class="n">${N(r.rem)}</td><td><input type="number" min="0" id="wr${i}" value="${r.rem}" style="width:110px"></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا يوجد متبقي</td></tr>'}</table></div>
  ${cr.length?`<h4 style="margin-top:12px">مرتجعات العملاء</h4><div class="tw"><table><tr><th>العميل</th><th>الصنف</th><th class="n">المسجّل</th><th>المستلم</th></tr>${cr.map((r,i)=>`<tr><td>${esc(farm(r.farmId).name)}</td><td>${esc(item(r.itemId).name)} ${esc(r.batch||'')}</td><td class="n">${N(r.qty)}</td><td><input type="number" min="0" id="wc${i}" value="${r.qty}" style="width:110px"></td></tr>`).join('')}</table></div>`:''}
  <label style="margin-top:10px">ملاحظات<input id="wN"></label><div class="actions"><button class="btn primary" id="wOK">تأكيد الاستلام</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
  $('#wOK').onclick=async()=>{let diff=false;const lines=[];for(let i=0;i<cu.length;i++){const r=cu[i],q=+$('#wr'+i).value||0;if(q!==r.rem)diff=true;lines.push({itemId:r.itemId,batch:r.batch,expected:r.rem,received:q});
      if(q>0){let b=L('batches').find(b=>b.itemId===r.itemId&&b.batch===r.batch);if(b){b.qty=+b.qty+q;await put('batches',b)}else if(r.batch){await put('batches',{id:uid(),itemId:r.itemId,batch:r.batch,expiry:r.expiry,qty:q,location:'مرتجع رحلات'})}}}
    const crl=cr.map((r,i)=>{const q=+$('#wc'+i).value||0;if(q!==+r.qty)diff=true;return{itemId:r.itemId,batch:r.batch||'',farmId:r.farmId,expected:+r.qty,received:q,reason:r.reason||''}});
    await patch('trips',tid,{whReturn:{at:nowISO(),by:meLabel(),lines,custReturns:crl,diff,note:$('#wN').value}});audit('استلام مخزن','trip',tid,`${t.no}${diff?' — يوجد اختلاف':' — مطابق'}`);closeModal();toast('تم تسجيل الاستلام')}}
function approveTrip(tid){const t=S.trips[tid];const warn=!t.whReturn&&custody(t).some(r=>r.rem>0)?'<div class="alert warn">لم يتم تسجيل استلام المتبقي بالمخزن بعد.</div>':'';
  confirmBox(`${warn}اعتماد رحلة ${esc(t.no)}؟ بعد الاعتماد لا يمكن تعديل أي بيانات فيها، وأي تصحيح يتم بإجراء موثّق.`,async()=>{await patch('trips',tid,{status:'approved',approvedAt:nowISO(),approvedBy:meLabel()});audit('اعتماد رحلة','trip',tid,t.no)},'اعتماد')}
function correctTrip(tid){const t=S.trips[tid];formModal('تصحيح موثّق على رحلة معتمدة',[{k:'reason',label:'سبب التصحيح',type:'select',opts:[['خطأ في الكمية','خطأ في الكمية'],['خطأ في التشغيلة','خطأ في التشغيلة'],['خطأ في العميل','خطأ في العميل'],['مرتجع لاحق','مرتجع لاحق'],['أخرى','أخرى']],req:1},{k:'text',label:'وصف التصحيح بالتفصيل (القيمة القديمة والجديدة)',type:'textarea',req:1,full:1}],{},async v=>{const c=Object.assign({id:uid(),at:nowISO(),by:meLabel()},v);await patch('trips',tid,{corrections:(t.corrections||[]).concat([c])});audit('تصحيح موثّق','trip',tid,`${t.no}: ${v.reason} — ${v.text}`)})}

/* ================= الأصناف والتشغيلات ================= */
const UNITS=['عبوة','زجاجة','فيال','أمبول','لتر','كيس','كرتونة','علبة','جرعة','كجم'];
const CATS=['مضادات حيوية','لقاحات','فيتامينات ومعادن','طفيليات','مطهرات','مضادات كوكسيديا','هرمونات','أخرى'];
function vItems(){const q=F.iq.trim();const its=L('items').filter(i=>!q||(i.name+i.code+(i.etaCode||'')).includes(q)).sort((a,b)=>(a.code||'').localeCompare(b.code||''));const ed=can('items')&&ME.role!=='manager'||ME.role==='admin';
  return `<div class="row between" style="margin-bottom:12px"><h2>الأصناف والتشغيلات</h2><div class="row">${ed?`${PR()?'<button class="btn" onclick="bulkPrices()">تعديل الأسعار</button>':''}<label class="btn" style="flex-direction:row;cursor:pointer">استيراد من Excel<input type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="importItems(this)"></label><button class="btn" onclick="editBatch()">+ تشغيلة / رصيد</button><button class="btn primary" onclick="editItem()">+ صنف جديد</button>`:''}</div></div>
  <div class="filters"><label>بحث<input value="${esc(F.iq)}" placeholder="الاسم أو الكود" oninput="F.iq=this.value;clearTimeout(window._iq);window._iq=setTimeout(render,300)"></label></div>
  <div class="card tw"><table><tr><th>الكود</th><th>الصنف</th><th>كود الفاتورة الإلكترونية</th><th>الفئة</th><th>الوحدة</th>${PR()?'<th class="n">السعر</th>':''}<th class="n">الرصيد</th><th>التشغيلات</th><th></th></tr>
  ${its.map(i=>{const bs=L('batches').filter(b=>b.itemId===i.id&&+b.qty>0).sort((a,b)=>(a.expiry||'').localeCompare(b.expiry||''));const tot=bs.reduce((a,b)=>a+(+b.qty),0);
   return `<tr style="${i.active===false?'opacity:.5':''}"><td class="b">${esc(i.code)}</td><td>${esc(i.name)} ${i.cold?'<span class="badge b-cold">مبرد</span>':''}${cfMeta('items',i)}</td><td class="sm">${esc(i.etaCode||'—')}</td><td class="sm">${esc(i.category||'')}</td><td>${esc(i.unit)}</td>${PR()?`<td class="n">${money(i.price)}</td>`:''}<td class="n b">${N(tot)}</td>
   <td>${bs.map(b=>{const d=daysTo(b.expiry);return `<span class="badge ${d!==null&&d<0?'b-err':d!==null&&d<=SET().expiryDays?'b-warn':''}" style="cursor:pointer;margin:1px" title="صلاحية ${esc(b.expiry)}" onclick="batchMenu('${b.id}')">${esc(b.batch)} • ${N(b.qty)}</span>`}).join('')||'<span class="mut sm">لا يوجد رصيد</span>'}</td>
   <td>${ed?`<button class="btn sm" onclick="editItem('${i.id}')">تعديل</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">لا توجد أصناف</td></tr>'}</table></div>
  ${PR()&&its.some(i=>!(+i.price>0))?`<div class="alert warn"><b>أسعار ناقصة</b><span style="flex:1">${N(L('items').filter(i=>!(+i.price>0)).length)} صنف بدون سعر بيع — الفاتورة هتطلع بصفر لحد ما تكمّلها.</span>${ed?'<button class="btn sm" onclick="bulkPrices()">إدخال الأسعار</button>':''}</div>`:''}<p class="mut sm">اضغط على أي تشغيلة لتعديل رصيدها أو تتبّع العملاء الذين استلموها (للاسترجاع).</p>`}
function editItem(id){const o=id?S.items[id]:{unit:'عبوة',active:true,category:'أخرى',price:0};
  formModal(id?'تعديل صنف':'صنف جديد',[{k:'code',label:'كود الصنف الداخلي',req:1},{k:'name',label:'اسم الصنف',req:1},{k:'etaCode',label:'كود الفاتورة الإلكترونية (EGS / GS1)',ph:'مثال: EG-123456789-VET001'},{k:'category',label:'الفئة',type:'list',opts:[...new Set(LST('cats').concat(L('items').map(i=>i.category).filter(Boolean)))]},{k:'unit',label:'الوحدة / العبوة',type:'list',opts:[...new Set(LST('units').concat(L('items').map(i=>i.unit).filter(Boolean)))]},...(PR()?[{k:'price',label:'سعر البيع للوحدة (ج.م)',type:'number',step:'0.01'}]:[]),{k:'cold',label:'يحتاج سلسلة تبريد',type:'check'},...cfFields('items'),{k:'active',label:'صنف فعّال',type:'check'}],o,async v=>{
    if(L('items').some(i=>i.code===v.code&&i.id!==id)){toast('الكود مستخدم لصنف آخر','err');return false}const obj=Object.assign({},o,v,{id:id||uid()});await put('items',obj);audit(id?'تعديل صنف':'إضافة صنف','item',obj.id,`${obj.code} — ${obj.name}${id?diffTxt(o,v):''}`)})}
function bulkPrices(){const its=L('items').sort((a,b)=>(a.code||'').localeCompare(b.code||''));
  modal(`<h3>تعديل أسعار البيع</h3><div class="filters"><label>بحث<input id="bpQ" placeholder="الاسم أو الكود"></label></div><div class="tw" style="max-height:60vh;overflow:auto"><table><tr><th>الكود</th><th>الصنف</th><th>الوحدة</th><th>السعر (ج.م)</th></tr>${its.map(i=>`<tr data-s="${esc(i.code+' '+i.name)}"><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td class="sm">${esc(i.unit)}</td><td><input type="number" step="0.01" min="0" data-id="${i.id}" value="${+i.price||''}" style="width:120px"></td></tr>`).join('')}</table></div><div class="actions"><button class="btn primary" id="bpOK">حفظ الأسعار</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`,true);
  $('#bpQ').oninput=e=>{const q=e.target.value.trim();document.querySelectorAll('#mbox tr[data-s]').forEach(r=>r.style.display=!q||r.dataset.s.includes(q)?'':'none')};
  $('#bpOK').onclick=async()=>{$('#bpOK').disabled=true;let n=0;for(const inp of document.querySelectorAll('#mbox input[data-id]')){const it=S.items[inp.dataset.id];const v=inp.value===''?0:+inp.value;if(it&&v!==(+it.price||0)){const old=it.price;await put('items',Object.assign({},it,{price:v}));audit('تعديل سعر','item',it.id,`${it.code} — ${it.name}: ${old||0} ← ${v}`);n++}}closeModal();toast(`تم تحديث ${N(n)} سعر`)}}
async function importItems(inp){const f=inp.files[0];inp.value='';if(!f)return;try{await loadScript(LIB.xlsx)}catch(e){return toast('تعذّر تحميل مكتبة Excel','err')}
  const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const pick=(r,keys)=>{for(const k of Object.keys(r)){const kk=String(k).trim();if(keys.some(x=>kk.includes(x)))return r[k]}return ''};
  const list=rows.map(r=>({code:String(pick(r,['كود','الكود','code','Code'])).trim(),name:String(pick(r,['اسم','الصنف','name','Name'])).trim(),unit:String(pick(r,['وحدة','عبوة','unit'])).trim(),price:pick(r,['سعر','price']),qty:pick(r,['رصيد','كمية','qty']),category:String(pick(r,['فئة','مجموعة','category'])).trim()})).filter(x=>x.code&&x.name);
  if(!list.length)return toast('لم أجد أعمدة «الكود» و«اسم الصنف» في الملف','err');
  confirmBox(`سيتم إضافة/تحديث <b>${N(list.length)}</b> صنف من الملف (الأعمدة المقروءة: الكود، الاسم، الوحدة، السعر، الرصيد، الفئة). الأصناف الموجودة بنفس الكود يتم تحديثها.`,async()=>{let a=0,u=0;
    for(const x of list){const ex=L('items').find(i=>i.code===x.code);const obj=Object.assign({active:true,cold:false,etaCode:'',price:0,unit:'عبوة',category:'أخرى'},ex||{},{id:ex?ex.id:uid(),code:x.code,name:x.name});if(x.unit)obj.unit=x.unit;if(x.category)obj.category=x.category;if(x.price!==''&&!isNaN(+x.price))obj.price=+x.price;await put('items',obj);ex?u++:a++;
      if(x.qty!==''&&+x.qty>0&&!ex)await put('batches',{id:uid(),itemId:obj.id,batch:'رصيد افتتاحي',expiry:'',qty:+x.qty,location:'مخزن رئيسي'})}
    audit('استيراد أصناف من Excel','item','',`${f.name}: جديد ${a} — تحديث ${u}`);toast(`تم: ${N(a)} جديد، ${N(u)} محدّث`)},'استيراد')}
function diffTxt(a,b){const ch=Object.keys(b).filter(k=>String(a[k]??'')!==String(b[k]??''));return ch.length?' | تغيير: '+ch.map(k=>`${k}: ${a[k]??''} ← ${b[k]}`).join('، '):''}
function editBatch(id,itemId){const o=id?S.batches[id]:{itemId:itemId||''};const its=L('items').filter(i=>i.active!==false);if(!its.length)return toast('أضف صنفاً أولاً','err');
  formModal(id?'تعديل تشغيلة':'إضافة تشغيلة / رصيد',[{k:'itemId',label:'الصنف',type:'select',opts:its.map(i=>[i.id,i.code+' — '+i.name]),req:1,full:1},{k:'batch',label:'رقم التشغيلة (Lot)',req:1},{k:'expiry',label:'تاريخ الصلاحية',type:'date'},{k:'qty',label:'الرصيد بالمخزن',type:'number',req:1},{k:'location',label:'مكان التخزين',ph:'مخزن رئيسي / ثلاجة 2'}],o,async v=>{
    const obj=Object.assign({},o,v,{id:id||uid()});await put('batches',obj);audit(id?'تعديل تشغيلة':'إضافة تشغيلة','batch',obj.id,`${item(v.itemId).name} — ${v.batch} — رصيد ${v.qty}${id?diffTxt(o,v):''}`)})}
function batchMenu(bid){const b=S.batches[bid];const it=item(b.itemId);const ed=ME.role==='admin'||ME.role==='warehouse';
  modal(`<h3>تشغيلة ${esc(b.batch)} — ${esc(it.name)}</h3><div class="kv"><div><span>الصلاحية</span>${esc(b.expiry)}</div><div><span>الرصيد</span>${N(b.qty)} ${esc(it.unit)}</div><div><span>المكان</span>${esc(b.location||'—')}</div></div>
  <div class="actions" style="margin-top:14px">${ed?`<button class="btn" onclick="editBatch('${bid}')">تعديل الرصيد</button>`:''}${can('recall')?`<button class="btn red" onclick="recall('${b.itemId}','${esc(b.batch)}')">تتبّع واسترجاع التشغيلة</button>`:''}<button class="btn" onclick="closeModal()">إغلاق</button></div>`)}
function recall(itemId,batch){const it=item(itemId);const rows=[];L('deliveries').forEach(d=>(d.lines||[]).forEach(l=>{if(l.itemId===itemId&&l.batch===batch&&+l.qty>0)rows.push({d,l})}));
  const onTrucks=L('trips').filter(t=>t.status==='out'||t.status==='draft').map(t=>({t,r:custody(t).find(r=>r.itemId===itemId&&r.batch===batch&&r.rem>0)})).filter(x=>x.r);
  window._rc=[['التاريخ','العميل','الهاتف','الفاتورة','الكمية']].concat(rows.map(({d,l})=>[d.date,farm(d.farmId).name,farm(d.farmId).phone||'',d.invNo,+l.qty]));
  const msg=f=>`*${SET().company}*\nالسادة ${f.name}،\nنرجو إيقاف استخدام الصنف: ${it.name} — تشغيلة رقم ${batch} لحين التواصل معكم بخصوص استرجاعه.\nنعتذر عن أي إزعاج، وللاستفسار: ${SET().phone||''}`;
  modal(`<h3>تتبّع التشغيلة ${esc(batch)} — ${esc(it.name)}</h3>
  <div class="note">العملاء الذين استلموا هذه التشغيلة: ${N(new Set(rows.map(x=>x.d.farmId)).size)} • إجمالي الكمية المسلّمة: ${N(rows.reduce((a,x)=>a+(+x.l.qty),0))} • على السيارات الآن: ${N(onTrucks.reduce((a,x)=>a+x.r.rem,0))}</div>
  <div class="tw" style="margin-top:10px"><table><tr><th>التاريخ</th><th>العميل</th><th>الفاتورة</th><th class="n">الكمية</th><th></th></tr>${rows.map(({d,l})=>{const f=farm(d.farmId);return `<tr><td>${d.date}</td><td>${esc(f.name)}<div class="mut sm">${esc(f.phone||'')}</div></td><td>${esc(d.invNo)}</td><td class="n">${N(l.qty)}</td><td>${waBtn(f.phone,msg(f),'إبلاغ','sm')}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">لم تُسلَّم لأي عميل</td></tr>'}</table></div>
  ${onTrucks.length?`<h4 style="margin-top:10px">على السيارات</h4>${onTrucks.map(x=>`<div class="alert warn"><b>${esc(x.t.no)}</b><span>${esc(drv(x.t.driverId).name)} — ${N(x.r.rem)} وحدة</span></div>`).join('')}`:''}
  <div class="actions"><button class="btn" onclick="exportRows('استرجاع_تشغيلة',window._rc)">تصدير Excel</button><button class="btn" onclick="closeModal()">إغلاق</button></div>`,true);
  audit('تتبّع تشغيلة','batch','',`${it.name} — ${batch}`)}

  ${L('drivers').map(d=>{const on=L('trips').find(t=>t.driverId===d.id&&t.status==='out');return `<tr style="${d.active===false?'opacity:.5':''}"><td class="b">${esc(d.name)}<div class="mut sm">رخصة: ${esc(d.license||'—')}</div></td><td>${esc(d.phone||'')}</td><td>${esc(d.helper||'')}</td><td>${on?`<span class="badge b-out">في رحلة ${esc(on.no)}</span>`:d.active===false?'<span class="badge">موقوف</span>':'<span class="badge b-ok">متاح</span>'}</td><td class="row">${d.phone?waBtn(d.phone,'','','sm'):''}${ed?`<button class="btn sm" onclick="editDriver('${d.id}')">تعديل</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">لا يوجد سائقون</td></tr>'}</table></div></div>

async function htmlToPDF(html,fn){toast('جاري تجهيز ملف PDF…');try{await loadScript(LIB.h2c);await loadScript(LIB.jspdf)}catch(e){return toast('تعذّر تحميل مكتبة PDF','err')}
  const box=$('#printArea');box.innerHTML=`<div class="doc">${html}</div>`;try{await document.fonts.ready}catch(e){}const imgs=[...box.querySelectorAll('img')];await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  const cv=await html2canvas(box.firstChild,{scale:2,backgroundColor:'#ffffff'});box.innerHTML='';const pdf=new window.jspdf.jsPDF('p','mm','a4');const iw=190,pageH=Math.floor(277*cv.width/iw);
  for(let y=0,p=0;y<cv.height;y+=pageH,p++){const c=document.createElement('canvas');c.width=cv.width;c.height=Math.min(pageH,cv.height-y);c.getContext('2d').drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(p)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',10,10,iw,c.height*iw/cv.width)}
  await saveFile(fn,pdf.output('blob'))}

function reportData(){const {rfrom:a,rto:b,rtype:k}=F;const inR=d=>d>=a&&d<=b;const ds=L('deliveries').filter(d=>inR(d.date)),ts=L('trips').filter(t=>inR(t.date)&&t.status!=='cancelled');
  if(k==='del'){const R=[['التاريخ','الفاتورة','السائق','العميل','كود','الصنف','التشغيلة','مسلّم','مرتجع','تالف','السعر','الإجمالي']];ds.sort((x,y)=>(x.at||'').localeCompare(y.at||'')).forEach(d=>(d.lines||[]).forEach(l=>R.push([d.date,d.invNo,drv(d.driverId).name,farm(d.farmId).name,l.code,l.name,l.batch||'',+l.qty||0,+l.ret||0,+l.dmg||0,+l.price||0,+(l.qty*l.price).toFixed(2)])));return R}
  if(k==='drv'){const R=[['السائق','الرحلات','المحطات','تم التسليم','تعذّر','نسبة التسليم %','الالتزام بالمواعيد %','مرتجع','تالف','قيمة المسلَّم']];
    L('drivers').forEach(dr=>{const my=ts.filter(t=>t.driverId===dr.id);if(!my.length)return;let st=0,dl=0,fl=0,ot=0,otn=0;my.forEach(t=>(t.stops||[]).forEach(s=>{st++;const x=sstatus(t,s);if(x==='delivered')dl++;if(x==='failed')fl++;const o=onTime(t,s);if(o!==null){otn++;if(o)ot++}}));
      const md=ds.filter(d=>d.driverId===dr.id);const ret=md.reduce((a,d)=>a+(d.lines||[]).reduce((b,l)=>b+(+l.ret||0),0),0),dmg=md.reduce((a,d)=>a+(d.lines||[]).reduce((b,l)=>b+(+l.dmg||0),0),0);
      R.push([dr.name,my.length,st,dl,fl,st?+(dl/st*100).toFixed(1):0,otn?+(ot/otn*100).toFixed(1):'—',ret,dmg,+md.reduce((a,d)=>a+(+d.total||0),0).toFixed(2)])});return R}
  if(k==='item'){const m={};ts.forEach(t=>(t.lines||[]).forEach(l=>{m[l.itemId]=m[l.itemId]||{ld:0,dl:0,rt:0,dm:0,v:0};m[l.itemId].ld+=+l.qty||0}));ds.forEach(d=>(d.lines||[]).forEach(l=>{m[l.itemId]=m[l.itemId]||{ld:0,dl:0,rt:0,dm:0,v:0};const x=m[l.itemId];x.dl+=+l.qty||0;x.rt+=+l.ret||0;x.dm+=+l.dmg||0;x.v+=(+l.qty||0)*(+l.price||0)}));
    return [['الكود','الصنف','الوحدة','محمّل','مسلّم','مرتجع','تالف','القيمة']].concat(Object.entries(m).map(([id,x])=>[item(id).code,item(id).name,item(id).unit,x.ld,x.dl,x.rt,x.dm,+x.v.toFixed(2)]))}
  if(k==='farm'){const m={};ds.forEach(d=>{m[d.farmId]=m[d.farmId]||{n:0,q:0,v:0,p:0};const x=m[d.farmId];x.n++;x.v+=+d.total||0;x.p+=+(d.pay?.amount)||0;x.q+=(d.lines||[]).reduce((a,l)=>a+(+l.qty||0),0)});
    return [['العميل','المنطقة','الهاتف','عدد الفواتير','إجمالي الكميات','القيمة','المحصّل','المتبقي']].concat(Object.entries(m).sort((a,b)=>b[1].v-a[1].v).map(([id,x])=>[farm(id).name,farm(id).area||'',farm(id).phone||'',x.n,x.q,+x.v.toFixed(2),+x.p.toFixed(2),+(x.v-x.p).toFixed(2)]))}
  if(k==='km'){const tol=+SET().kmTolerance||25;return [['الرحلة','التاريخ','السائق','السيارة','عداد البداية','عداد النهاية','كم فعلي','كم مخطط','الفرق %','كم GPS','المحطات','وقود (لتر)','كم/لتر','المصروفات']].concat(ts.filter(t=>t.startOdo).sort((x,y)=>(x.no||'').localeCompare(y.no||'')).map(t=>{const km=tripKm(t),fu=tripFuel(t);return [t.no,t.date,drv(t.driverId).name,veh(t.vehicleId).plate,+t.startOdo||0,+t.endOdo||'',km??'',t.kmPlanned||'',km!=null&&t.kmPlanned?Math.round((km-t.kmPlanned)/t.kmPlanned*100):'',t.kmGps||gpsKm(t)||'',(t.stops||[]).length,fu||'',km&&fu?+(km/fu).toFixed(1):'',+tripExp(t).toFixed(2)]}))}
  if(k==='veh'){return [['السيارة','الرحلات','إجمالي كم','وقود (لتر)','تكلفة الوقود','كم/لتر','مصروفات أخرى','صيانة (تكلفة)','العداد الحالي','الزيت القادم عند']].concat(L('vehicles').map(v=>{const my=ts.filter(t=>t.vehicleId===v.id);if(!my.length&&!(v.maint||[]).some(m=>m.date>=a&&m.date<=b))return null;const km=my.reduce((x,t)=>x+(tripKm(t)||0),0),fu=my.reduce((x,t)=>x+tripFuel(t),0),fc=my.reduce((x,t)=>x+(t.expenses||[]).filter(e=>e.type==='fuel').reduce((y,e)=>y+(+e.amount||0),0),0),oth=my.reduce((x,t)=>x+tripExp(t),0)-fc,mc=(v.maint||[]).filter(m=>m.date>=a&&m.date<=b).reduce((x,m)=>x+(+m.cost||0),0),o=oilStatus(v);
    return [v.plate,my.length,km,fu,+fc.toFixed(2),km&&fu?+(km/fu).toFixed(1):'',+oth.toFixed(2),+mc.toFixed(2),+v.odometer||'',o?o.next:'']}).filter(Boolean))}
  if(k==='trip'){return [['الرحلة','التاريخ','السائق','السيارة','الخروج','العودة','المحطات','المسلَّم','الحالة','استلام المخزن']].concat(ts.sort((x,y)=>(x.no||'').localeCompare(y.no||'')).map(t=>[t.no,t.date,drv(t.driverId).name,veh(t.vehicleId).plate,fmtT(t.outTime),fmtT(t.returnTime),(t.stops||[]).length,(t.stops||[]).filter(s=>sstatus(t,s)==='delivered').length,STAT[t.status],t.whReturn?(t.whReturn.diff?'يوجد اختلاف':'مطابق'):'—']))}
  return [[]]}
const MONEYCOLS=['السعر','الإجمالي','القيمة','المحصّل','المتبقي','قيمة المسلَّم'];
function reportView(){const R=reportData();if(PR())return R;const keep=R[0].map((h,i)=>MONEYCOLS.includes(h)?-1:i).filter(i=>i>=0);return R.map(r=>keep.map(i=>r[i]))}
const RTYPES={km:'المسافات والعداد',veh:'السيارات والمصروفات',del:'تفصيل التسليمات',drv:'أداء السائقين',item:'حركة الأصناف',farm:'العملاء والمسحوبات',trip:'الرحلات'};

  <div class="card tw"><table><tr>${R[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${R.slice(1).map(r=>`<tr>${r.map(c=>`<td class="${nf(c)?'n':''}">${nf(c)?N(c):esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${R[0].length}" class="empty">لا توجد بيانات في هذه الفترة</td></tr>`}</table></div>`}
function reportPDF(){const R=reportView();htmlToPDF(`<div class="dochead"><div><img src="${LOGO_FULL}" alt="" style="width:96px;height:auto;float:right;margin-left:12px"><h2 style="color:#334C36">${esc(SET().company)}</h2><div>تقرير: ${RTYPES[F.rtype]}</div></div><div>من ${F.rfrom}<br>إلى ${F.rto}</div></div><table><tr>${R[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${R.slice(1).map(r=>`<tr>${r.map(c=>`<td>${typeof c==='number'?N(c):esc(c)}</td>`).join('')}</tr>`).join('')}</table><p style="font-size:11px;color:#666">طُبع بواسطة ${esc(meLabel())} — ${fmtDT(nowISO())}</p>`,`${RTYPES[F.rtype]}_${F.rfrom}_${F.rto}.pdf`)}

  <div class="card tw"><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr>${a.slice(0,500).map(x=>`<tr><td class="sm" style="white-space:nowrap">${fmtDT(x.at)}</td><td>${esc(x.who)}</td><td class="b">${esc(x.action)}</td><td class="sm">${esc(x.details)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا يوجد</td></tr>'}</table></div><p class="mut sm">السجل للإضافة فقط — لا توجد أي أداة في الواجهة لتعديله أو حذفه.</p>`}
function vSettings(){const s=SET();return `<div class="ph"><div><h2>الإعدادات</h2><p>خصّص التطبيق على طريقة شغلكم</p></div></div><div class="row" style="margin-bottom:14px;gap:6px">${STABS.map(t=>`<button class="btn ${STAB===t[0]?'primary':''}" onclick="STAB='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
  ${STAB==='devices'?vDevices():''}${STAB==='lists'?vListsSettings():''}${STAB==='perms'?vPermSettings():''}<form id="sf" class="card grid2 ${STAB==='general'?'':'hidden'}" onsubmit="saveSettings(event)">
  <label>اسم الشركة<input name="company" value="${esc(s.company)}"></label><label>الاسم بالإنجليزية<input name="companyEn" value="${esc(s.companyEn)}"></label><label>هاتف الشركة<input name="phone" value="${esc(s.phone)}"></label><label>العنوان<input name="address" value="${esc(s.address)}"></label>

  <label>نسبة الضريبة على الفاتورة %<input name="vat" type="number" step="0.01" value="${s.vat}"></label><label>تنبيه الصلاحية قبل (يوم)<input name="expiryDays" type="number" value="${s.expiryDays}"></label>
  <label>أقل حرارة مسموحة °م<input name="tempMin" type="number" step="0.1" value="${s.tempMin}"></label><label>أعلى حرارة مسموحة °م<input name="tempMax" type="number" step="0.1" value="${s.tempMax}"></label>
  <label>مسافة الخروج عن المسار (كم)<input name="routeKm" type="number" step="0.1" value="${s.routeKm}"></label><label>سماحية التأخير (دقيقة)<input name="lateMin" type="number" value="${s.lateMin}"></label>
  <label>بداية ساعات العمل للتتبع<input name="workFrom" type="number" min="0" max="23" value="${s.workFrom}"></label><label>نهاية ساعات العمل للتتبع<input name="workTo" type="number" min="1" max="24" value="${s.workTo}"></label>
  <h3 class="full" style="margin-top:8px">🚛 السيارات والمسافات</h3>
  <label>موقع الشركة / المخزن — خط العرض<input name="depotLat" id="dLat" value="${esc(s.depotLat)}"></label><label>خط الطول<input name="depotLng" id="dLng" value="${esc(s.depotLng)}"></label>

async function saveSettings(e){e.preventDefault();const fd=new FormData($('#sf'));const s=SET();const o={};['company','companyEn','phone','address','taxNo','adminWa'].forEach(k=>o[k]=fd.get(k).trim());['vat','expiryDays','tempMin','tempMax','routeKm','lateMin','workFrom','workTo','roadFactor','kmTolerance','oilAlertKm','docAlertDays','odoGapKm'].forEach(k=>o[k]=+fd.get(k));o.depotLat=fd.get('depotLat').trim()===''?'':+fd.get('depotLat');o.depotLng=fd.get('depotLng').trim()===''?'':+fd.get('depotLng');o.odoPhotoReq=fd.get('odoPhotoReq')==='on';o.showPrices=fd.get('showPrices')==='on';
  o.pins={};for(const r of ['admin','manager','warehouse','accountant']){const p=fd.get('pin_'+r).trim();if(p.length<4)return toast('الرقم السري 4 أرقام على الأقل','err');o.pins[r]=p}
  await put('settings',Object.assign({invPrefix:s.invPrefix},S.settings.main||{},o,{id:'main'}));audit('تعديل الإعدادات','settings','main','');toast('تم الحفظ')}
async function depotHere(){toast('جاري تحديد الموقع…');const l=await getLoc();if(!$('#dLat'))return;if(l){$('#dLat').value=l.lat;$('#dLng').value=l.lng;toast('تم — اضغط حفظ الإعدادات')}else toast('الجهاز لم يسمح بالـ GPS — الصق رابط الموقع من خرائط جوجل','err')}
async function importBackup(inp){const f=inp.files[0];inp.value='';if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){return toast('الملف مش نسخة احتياطية صحيحة','err')}
  const cols=COLS.filter(c=>o[c]&&typeof o[c]==='object');const n=cols.reduce((a,c)=>a+Object.keys(o[c]).length,0);if(!n)return toast('الملف فاضي','err');
  confirmBox(`استيراد <b>${N(n)}</b> سجل (${cols.map(c=>c+': '+Object.keys(o[c]).length).join('، ')})؟ السجلات اللي ليها نفس الرقم هتتحدّث.`,async()=>{let i=0;for(const c of cols){for(const d of Object.values(o[c])){if(!d||!d.id)continue;await put(c,d);i++;if(i%25===0)toast(`تم ${N(i)} من ${N(n)}…`)}}audit('استيراد نسخة احتياطية','system','',`${n} سجل`);toast(`✅ تم استيراد ${N(i)} سجل`)},'استيراد')}
function backup(){const o={};COLS.forEach(c=>o[c]=S[c]);saveFile(`نسخة_احتياطية_${today()}.json`,JSON.stringify(o,null,1))}

function routeLen(pts,closed){let k=0;for(let i=1;i<pts.length;i++)k+=haversine(pts[i-1],pts[i]);if(closed&&pts.length>1)k+=haversine(pts[pts.length-1],pts[0]);return k}

  if(withLoc.length<2&&!(d&&withLoc.length))return{stops,before:null,after:null,noLoc:noLoc.length};
  const tourLen=arr=>{const pts=(d?[d]:[]).concat(arr.map(x=>x.p));return routeLen(pts,!!d)};const before=tourLen(withLoc);
  // أقرب جار

  while(rest.length){let bi=0,bd=Infinity;rest.forEach((x,i)=>{const dd=haversine(cur,x.p);if(dd<bd){bd=dd;bi=i}});const nx=rest.splice(bi,1)[0];tour.push(nx);cur=nx.p}

  const after=tourLen(tour);return{stops:tour.map(x=>x.s).concat(noLoc),before,after,noLoc:noLoc.length}}

function gsearch(q){GSQ=q;const box=$('#gsr');if(!box)return;q=q.trim();if(q.length<2){box.classList.add('hidden');return}
  const R=[];const has=(...a)=>a.some(x=>String(x||'').includes(q));
  L('trips').filter(t=>has(t.no,drv(t.driverId).name,veh(t.vehicleId).plate,t.route)).slice(0,5).forEach(t=>R.push(['رحلة',`${t.no} — ${drv(t.driverId).name} — ${t.date}`,`openTrip('${t.id}')`]));
  L('deliveries').filter(d=>has(d.invNo,farm(d.farmId).name,d.receiver)).slice(0,5).forEach(d=>R.push([DOCN(),`${d.invNo} — ${farm(d.farmId).name} — ${d.date}`,`showInvoice('${d.id}')`]));
  L('farms').filter(f=>has(f.name,f.phone,f.area,f.owner)).slice(0,5).forEach(f=>R.push(['عميل',`${f.name}${f.area?' — '+f.area:''}`,`F.q='${esc(f.name).replace(/'/g,'')}';go('farms')`]));
  L('items').filter(i=>has(i.name,i.code)).slice(0,6).forEach(i=>R.push(['صنف',`${i.code} — ${i.name}`,`F.iq='${esc(i.code)}';go('items')`]));
  L('batches').filter(b=>has(b.batch)&&b.batch!=='رصيد افتتاحي').slice(0,3).forEach(b=>R.push(['تشغيلة',`${b.batch} — ${item(b.itemId).name}`,`batchMenu('${b.id}')`]));
  box.innerHTML=R.length?R.map(r=>`<button onmousedown="event.preventDefault()" onclick="GSQ='';${r[2]}"><span class="badge">${r[0]}</span>${esc(r[1])}</button>`).join(''):'<div class="empty" style="padding:14px">مفيش نتائج</div>';box.classList.remove('hidden')}
